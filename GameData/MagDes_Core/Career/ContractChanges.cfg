@Contracts:FOR[MagDes]
{
	%SunStationaryName = auoxstationary // What contracts call heliostationary orbits of the Sun
	%HomeStationaryName = geostationary // What contracts call geostationary orbits of the home planet
	%OtherStationaryName = stationary // What contracts call stationary orbits of any other planet
	%SunSynchronousName = auoxsynchronous // What contracts call heliosynchronous orbits of the Sun
	%HomeSynchronousName = geosynchronous // What contracts call geosynchronous orbits of the home planet
	%OtherSynchronousName = synchronous // What contracts call synchronous orbits of any other planet
	%MolniyaName = Molniya // What contracts call Molniya orbits
	
	@ISRU //forbid Ore resource request contracts on stars and gas giants.
	{
		@RESOURCE_REQUEST:HAS[#Name[Ore]]
		{
			Forbidden = Sun
			Forbidden = Auox
			Forbidden = Helva
			Forbidden = Kareen
			Forbidden = Drados
			Forbidden = Ubun
			Forbidden = RengalBarycenter
			Forbidden = Remi
			Forbidden = Revo
			Forbidden = Ada
			Forbidden = Haun
			Forbidden = Egress
		}
	}
	
	@SURVEY
	{
		@SURVEY_DEFINITION,*
		{
			Forbidden = Sun
			Forbidden = Auox
			Forbidden = Helva
			Forbidden = Kareen
			Forbidden = Drados
			Forbidden = Ubun
			Forbidden = RengalBarycenter
			Forbidden = Remi
			Forbidden = Revo
			Forbidden = Ada
			Forbidden = Haun
		}
	}
	
	@RoverConstruction
	{
		@MinimumGeeASL = 0.02 // same as stock. Phenix can be selected for a rover contract, but not Pheber.
		@MaximumGeeASL = 2.5 // The maximum GeeASL a celestial body must have to be selected for this contract. For some reason this is 0.4 in stock, which is crazy! Why no Laythe Tylo or Eve rover contracts?
	}
}