// Bitmask: add up the values for each thing you want and that single number uniquely defines a truth table.
// SrfLanded = 1
// SrfSplashed = 2
// FlyingLow = 4
// FlyingHigh = 8
// InSpaceLow = 16
// InSpaceHigh = 32
// situationMask: which situations the experiment can be run.
// biomeMask: which situations the experiment should be biome specific in

@EXPERIMENT_DEFINITION:HAS[#id[CrewReport]]:FOR[MagDes]
{
	@situationMask = 63
	@biomeMask = 23 //1+2+4+16=23
	//adds InSpaceLow biome differentiation to 'crew report' science.
}

@EXPERIMENT_DEFINITION:HAS[#id[infraredTelescope]]:FOR[MagDes]
{
	%biomeMask = 0 //no biome-specific results.
	%situationMask = 32 //only works in Space high.
}

EXPERIMENT_DEFINITION
{
	id = infraredAstronomy
	title = Infrared Astronomy
	baseValue = 10
	scienceCap = 35
	dataScale = 2
	biomeMask = 0
	situationMask = 32 //only works in Space high.
	RESULTS
	{
		SrfSplashed = Sensitive optics and sea water do not mix!
		SrfLanded = It's too hot here! This instrument is designed to be used in deep space only!
		InSpaceLow = It's too hot here! This instrument is designed to be used in high orbit only!
		InSpaceHigh = You map out the stars in infrared light.
	}
}

@PART[InfraredTelescope]:FOR[MagDes]
{
	@title = UNDRSTAND Infrared Telescope
	@description = The UNDRSTAND Space Telescope uses infrared light to detect celestial bodies, such as asteroids, that may pose a risk to Kerbin, as well as for planetary research. Due to intense radiant heat from planetary surfaces, it can only be used in high orbit around a celestial body. When operated by a Scientist on the crew, the UNDRSTAND instrument can also be used for infrared astrophysical and cosmological research.
	@MODULE[infraredTelescope]
	{
		@experimentActionName = Image Planet in IR
		@resetActionName = Delete Planet Image
		@collectActionName = Take IR Planet Data
	}
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = infraredAstronomy
		experimentActionName = Conduct Astronomical Study
		resetActionName = Delete Astronomical Data
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = False
		xmitDataScalar = 0.4
		dataIsCollectable = True
		collectActionName = Take Astronomical Data
		interactionRange = 1.2
		rerunnable = True
		resettable = False
		usageReqMaskInternal = 2 //requires a scientist to be a member of the crew.
		usageReqMaskExternal = 8
	}
}