@PART:HAS[#TechRequired[aerospaceTech],@MagDesSettings:HAS[#TechTree[Mesbin]]]:FOR[MagDes]
{
	DEFAULTTech = AerospaceTech
	@TechRequired = hypersonicFlight
	//merge AerospaceTech into HypersonicFlight.
}

@TechTree:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@TechTree:HAS[@MagDesSettings:HAS[#TechTree[Mesbin]]]:FOR[MagDes]
{
	@RDNode:HAS[#id[engineering101]]
	{
		@description = How hard can Astronautical Engineering be anyway?
	}
	@RDNode:HAS[#id[survivability]]
	{
		//rebranding survivability as Safety Equipment.
		@title = Safety Equipment
		@description = The art and science of saving Kerbal lives... by replacing them with robots. Also in development are new environmental regulation systems.
		@icon = RDicon_unmanned-advanced
	}
	@RDNode:HAS[#id[stability]]
	{
		@icon = RDicon_control-flight
	}
	
	//REPOSITION AERODYNAMICS SUBTREE.
	@RDNode:HAS[#id[aviation]]
	{
		@cost = 90
		@pos = -1723,1243,0
		@description = A 7th grader's science fair project has really revolutionized the field of atmospheric flight. These new aircraft parts were developed from the highest quality paper mache test vehicles. Used effectively and within a sufficiently thick atmosphere, they should allow for sustained horizontal flight. Warranty void when exposed to void.
		//make aviation's parent "general construction" instead of "stability"
		!Parent:HAS[#parentID[stability]]{}
		Parent
		{
			parentID = generalConstruction
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	
	@RDNode:HAS[#id[aerodynamicSystems]]
	{
		@cost = 160
		@pos = -1521,1243,0
		!Parent:HAS[#parentID[generalConstruction]]{}
		//Get rid of aeroSystem's dependence upon generalConstruction.
		//Its only parent is aviation.
	}
	
	@RDNode:HAS[#id[supersonicFlight]]
	{
		@cost = 300
		@pos = -1310,1278,0
	}
	@RDNode:HAS[#id[advAerodynamics]]
	{
		@cost = 300
		@pos = -1310,1207,0
	}
	
	@RDNode:HAS[#id[highAltitudeFlight]]
	{
		@cost = 550
		@pos = -1118,1278,0
	}
	@RDNode:HAS[#id[heavyAerodynamics]]
	{
		@cost = 550
		@pos = -1118,1207,0
	}
	
	@RDNode:HAS[#id[hypersonicFlight]]
	{
		@cost = 1000
		@pos = -956,1278,0
	}
	@RDNode:HAS[#id[experimentalAerodynamics]]
	{
		@cost = 1000
		@pos = -956,1207,0
	}
	
	!RDNode:HAS[#id[aerospaceTech]]{}
	//Get rid of Aerospace Tech node.
	
	@RDNode:HAS[#id[fieldScience]]
	{
		@cost = 45
		@pos = -1946,1201,0
		//move f.s. to where aviation was.
		@description = Previous generations of mobile wheeled vehicles were powered by aluminium/oxygen fueled steam engines, and were not light enough to be space worthy. These new electric-powered wheels are much more suitable for space exploration.
		Parent
		{
			parentID = stability
			lineFrom = RIGHT
			lineTo = LEFT
		}
		!Parent:HAS[#parentID[advExploration]]{}
		!Parent:HAS[#parentID[advLanding]]{}
		//Get rid of field science's dependence opon advEx, advLand. These will be Advanced Motor's dependencies.
	}
	@RDNode:HAS[#id[landing]]
	{
		!Parent:HAS[#parentID[aviation]]{}
		Parent
		{
			parentID = fieldScience
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	@RDNode:HAS[#id[advancedMotors]]
	{
		//Put advanced motors where field science was.
		//pos = -1309,1067,0
		@pos = -1309,1053.15,-1
		@cost = 300
		!Parent:HAS[#parentID[fieldScience]]{}
		Parent
		{
			parentID = advLanding
			lineFrom = RIGHT
			lineTo = LEFT
		}
		Parent
		{
			parentID = advExploration
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	@RDNode:HAS[#id[landing]]
	{
		@icon = RDicon_survivability
	}
	@RDNode:HAS[#id[advScienceTech]]
	{
		!Parent:HAS[#parentID[fieldScience]]{}
		Parent
		{
			parentID = advancedMotors
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	@RDNode:HAS[#id[actuators]]
	{
		@description = Perfecting the art and science of grabbing things with robotic claws.
	}
}


@PART[LiquidEngineRE-J10]:HAS[@MagDesSettings:HAS[#TechTree[Mesbin]]]:FOR[MagDes]
{
	@title = AJ-10 "Wolfhound"  Service Propulsion System
	@mass = 0.7
	@description = While our engineers could never find the secret ingredient (often referred to simply as "Specific Im-balance") that made the mythical Wolfhound an engine of exceptional thrust and specific impulse, they were able to produce a reasonably efficient upper stage rocket motor. Despite its bulk, it is a very lightweight engine. Woof! The large bell of this engine will leave your ears ringing!
	@MODULE[ModuleEngines]
	{
		!atmosphereCurve{}
		@maxThrust = 91 //Identical to the real version. Since this engine is the same size as the real version and is not downscaled, this seems reasonable.
		atmosphereCurve
		{
			key = 0 350 //On par with the Poodle. It still has a better TWR though.
			key = 1 70
			key = 3 0.001
		}
	}
}
@PART[LiquidEngineRE-I2]:HAS[@MagDesSettings:HAS[#TechTree[Mesbin]]]:FOR[MagDes]
{
	@MODULE[ModuleEngines]
	{
		!atmosphereCurve{}
		@maxThrust = 510
		//Now it can actually lift Saturn stages >:v
		atmosphereCurve
		{
			key = 0 357 //This makes it the most efficient LFO engine in the game by a few seconds.
			key = 1 168
			key = 3 56
			key = 15 11.2
		}
	}
}