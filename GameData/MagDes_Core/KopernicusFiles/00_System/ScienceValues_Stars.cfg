@Kopernicus:FOR[MagDesScience]
{
	//7: Auox (high space) (value 7)
	//8: Giant Planets beyond Egress (value 7-9)
	//9: Dwarf planets beyond giant planets. (value 11)
	
	//10: Pentus & Rengal
	//11: Ada & Leve
	//12: Kona & Kareen
	//13: Helva
	
	//all values assume the homeworld orbits Limnus. Future intrastellar homeswaps must adjust accordingly.
	
	@Body:HAS[#identifier[MagDes/Auox]]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				inSpaceLowDataValue = 15 // Science multiplier for in space low science.
				inSpaceHighDataValue = 7 // Science multiplier for in space high science.
				recoveryValue = 7
				spaceAltitudeThreshold = 15000000 //outer limit of accretion disk.
			}
		}
	}
	@Body[Helva]
	{
		%contractWeight = 20
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				flyingLowDataValue = 20 // Science multiplier for flying low science.
				flyingHighDataValue = 17 // Science multiplier for flying high science.
				inSpaceLowDataValue = 15 // Science multiplier for in space low science.
				inSpaceHighDataValue = 15 // Science multiplier for in space high science.
				recoveryValue = 18
				flyingAltitudeThreshold = 18000 // Altitude when "flying at <body>" transitions from/to "from <body>'s upper atmosphere"
				spaceAltitudeThreshold = 10057200 // Altitude when "in space low" transitions from/to "in space high"
			}
		}
	}
