			description = Haun was named for the Redefinitionist goddess of new life. She was gifted her epithet by a once trusted friend, Auox. According to the Third Book of Redefinition, what Auox did next would eventually lead to The Big Bang, and the beginning of our universe. Before the event that would mark the end for her universe, Haun used her newfound role as goddess of life to create a grand garden, hospitable to all. Many of the planets of the Haun System are named for characters who would eventually take residence within Haun's garden.\n\nHaun is what astronomers informally refer to as an "orange dwarf," a star on the cooler side, with a long life ahead of it but without the chaotic and often destructive flaring associated with smaller stars. Haun provides a comfortable gravitational residence for our homeworld, and a nice warmth. We aren't quite sure what Haun was named prior to Limnus being settled, if anything.
