MagDesSettings
{
	SystemType = Replacer
	//Options: "Interstellar", "Replacer"
	//Defaults to Replacer
	//Interstellar: Makes Auox a new star system.
	//Replacer: Replaces the Kerbol system with the Auox System.
	//Interstellar is not currently implemented.
	
	Homeworld = Limnus
	//Options: "Limnus", "Ripley"
	//Defaults to Limnus
	//You can only choose an option that corresponds to a homeworld from a module you have installed.
	//Currently all homeworlds belong to the Haun System.
	//Haun System Homeworlds:
	//    Limnus: Kerbin-sized tidally locked planet with rings and several small moons. Haun Default.
	//    Ripley: Mars-sized, airless, tri-axial ellipsoidal satellite of the water world Meir.
	//            Be sure to read the description for AirlessHomeworldUseExosphere and TechTree below.
	
	AirlessHomeworldUseExosphere = False
	//Options: "True", "False"
	//Defaults to False. Read below!
	//Enables an 'exosphere' or empty atmosphere for Ripley (or other airless homeworlds if they are implemented in future.)
	//This is required to do the first career contract that calls for entering space.
	//That requires not *starting* in space, so we add an exosphere just barely tall enough to encompass the space center
	//Allowing this contract to be completed in career mode.
	//We recommend you turn this on (True) when starting a career game, 
	//   but turn it off (False) the next time you load the game after completing the first contract.
	
	TechTree = Default
	//Options: "Default", "Mesbin", "Ripley"
	//Defaults to "Default"
	//Compatible with Community Tech Tree.
	//Default: Stock tech tree, or whatever other tech tree mod you install.
	//Mesbin: For a more stockalike experience on Ripley. Uses Mesbin's modified tech tree from Whirligig World.
	//Ripley: Not implemented yet. Probes-first tech tree for compatibility with Ripley's lore. Crewed vehicles are mid-game (i.e., locked behind the Tier 2 R&D building at 100 science)
}