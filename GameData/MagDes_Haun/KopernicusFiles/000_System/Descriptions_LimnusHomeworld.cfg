@Kopernicus:HAS[!MagDesSettings]:AFTER[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Limnus]]]:AFTER[MagDes]
{
	@Body[Haun]
	{
		@Properties
		{
			%description = Haun was named for the Redefinitionist goddess of new life. She was gifted her epithet by a once trusted friend, Auox. According to the Third Book of Redefinition, what Auox did next would eventually lead to The Big Bang, and the beginning of our universe. Before the event that would mark the end for her universe, Haun used her newfound role as goddess of life to create a grand garden, hospitable to all. Many of the planets of the Haun System are named for characters who would eventually take residence within Haun's garden.\n\nHaun is what astronomers informally refer to as an "orange dwarf," a star on the cooler side, with a long life ahead of it but without the chaotic and often destructive flaring associated with smaller stars. Haun provides a comfortable gravitational residence for our homeworld, and a nice warmth. We aren't quite sure what Haun was named prior to Limnus being settled, if anything.
		}
	}
	
	@Body[Irecula]
	{
		@Properties
		{
			%description = Irecula was a goddess who held the epithet of sunlight in Redefinitionist mythology. Working diligently under the eye of Egress, goddess of time, she oversaw the rise and set of the Sun in the Before Universe.\n\nIrecula the planet can be very difficult to observe, it only occasionally crests the horizon from Limnus' twilight band. We know it's a very dark coloration too, which makes the name more ironic and observing it more difficult. Irecula is potentially one of the hardest planets to reach in the Haun System owing to its high velocity orbit around Haun, but the launch windows come often!
		}
	}
	@Body[Revel]
	{
		@Properties
		{
			%description = There is an old story in Redefinitionist mythology about a village under threat from a great and powerful dragon. Reluctant but seeing no other course of action, a woman stepped forward to face the dragon, all on her own. The journey to meet the dragon, and eventually slay it, was treacherous to both body and mind in equal part. The lonely path of destiny changed the hero forever, all the way down to her soul. When they returned to their village, the head of the beast limp upon a wooden cart behind their horse, they returned in victory. But he returned not as the woman who swallowed fear to change fate, but as the man who succeeded and was changed by fate in turn. That hero's name, his new name, was Revel. Born in flame, defined by himself alone.\n\nRevel is the second innermost planet of Haun, we know it's very red and only a touch smaller than Limnus. Albedo features reported by astronomers imply either a diverse surface or an overactive imagination.
		}
	}
	
	@Body[Ollmi]
	{
		@Properties
		{
			%description = It spanned hundreds of miles in all directions. Wild and suffocating vines choking the ground, grappling their way up wooden stakes and across wire mesh roofs. Upon each vine grew ripe bundles of plump fruit, deep red pustules of unrefined juice. The vineyard occupied a substantial crop near the center of Haun's garden, secured within an ivory palisade. In the universe before, anyone could homebrew, but who in their right mind would dare compete with the exports of the Goddess of Wine?\n\nAstronomers have long reported an apparent "shine" on Ollmi's lit face, believed to be associated with reflective oceans on the planet's surface. Ollmi even has bright reflective clouds, perhaps made of water like those on Limnus. One might have the impression that Ollmi and Limnus are twin worlds, but the planet's disconcertingly red color is uneasing. As the argument often goes: we don't know why The Hopeful crashed, but surely there was a reason they chose to target Limnus instead.
		}
	}
	@Body[Olimar]
	{
		@Properties
		{
			%description = It is common in stories for travelers to mistake Ollmi for a generous and gracious character. So often Ollmi would gaze down from her blood-red throne with a crooked smile. One hand propping up her cheek while the other gently caressed the fur of her beloved pet, a rat half a meter from hind to nose, with a tail just as long.\n\nOlimar is a curious case as the only satellite of Ollmi, because outside of extraordinary circumstances like Limnus, the rocky worlds of Haun shouldn't host them at all. It's a stroke of luck that Olimar was discovered at all considering the challenges of observing the inner planets from Limnus.
		}
	}
	
	@Body[Meir]
	{
		@Properties
		{
			%description = A great unfinished monument in Haun's honor sat in the wild woods of her garden. The mistake of organizing the monument's construction under the Goddess of Potential formed the moral theme of a story in The Fourth Book of Redefinitionism. A monument perpetually expanded, torn down, and redesigned in the pursuit of perfection. Meir, in her isolation, would eventually become the only one working upon it, forever.\n\nMeir is the incredibly bright resident giant of the inner system, it hosts banded clouds and even a system of two large moons. Meir is substantially denser than the giants of the outer system, and based on its spectrum astronomers have taken to calling it a "Water Giant."
		}
	}
	@Body[Ripley]
	{
		@Properties
		{
			%description = If one held little value for their belongings, there was one woman who could alleviate them faster than anyone else. A traveling celebrity, a gambler with a success record beyond reason. Ripley always said the key to success was to hold your cards close to your chest and keep a blank face. After all, if she told people outright that she was Meir's daughter, the Goddess of Luck? No one would play!\n\nRipley is a bizarre world huddled right up against its parent planet. It is distorted into an oblong shape due to the immense tidal forces of Meir. In terms of brightness and color, it's near-identical to Neih further out. Ripley's orbit seems to follow Meir's equator, as one would expect of an eldest daughter.
		}
	}
	@Body[Neih]
	{
		@Properties
		{
			%description = Neih was one of Meir's closet companions, a minor Goddess of the Hearth. She kept a warm fire and hunted fresh game from the woods around the great monument. One of the first people to join Meir's efforts to honor the garden's hostess. She was also the last to leave, reluctantly choosing herself over perpetuity of Meir's monument.\n\nNeih is the outer satellite of Meir and the first such world discovered around another planet. Albedo maps made by ground based astronomers are often fuzzy and indistinct, one astronomer infamously stated the contemporary map "kinda sucks bad, like really bad." Neih's wide orbit aligns with the Haunian Ecliptic Plane rather than Meir's equator, as if it's tempted to leave entirely.
		}
	}
	
	@Body[Limnus]
	{
		@Properties
		{
			%description = Scarred. It's the one descriptor that poets, cartographers, and geologists can agree on to describe Limnus: scarred.\n\nSince the surface and skies of Limnus were first charted by the original settlers of this world, the large circular depressions, the ring-shaped mountain ranges, the central peaks, painted a grim story. Though scattered, the collective memory of Kerbalkind could still recognize what a crater was, and where they came from. For a terrestrial world possessing seas, an atmosphere, and very active volcanoes, Limnus' surface displays many very large impact craters of various structure and age. There are grim theories for where these impact events come from - and it falls upon the space program to answer those questions. How safe Limnus is now, and how long that safety will remain, is a key question for the world's space programs to answer. Should those answers be negative, where we should go next becomes an equally important question.
		}
	}
	@Body[Phenom]
	{
		@Properties
		{
			%description = This object is <color=#ff0000>EXCEPTIONALLY SMALL!</color> Exceptionally small objects are bodies with only one biome, and low scientific returns. Sometimes they're nearby larger objects, or in groups with other small bodies. A mission dedicated to just one of them might not have good returns, but as part of a larger whole, they can make for a nice piece of bonus science.\n\nPhenom is the innermost natural satellite of Limnus, but don't let its dimunitive size fool you - in a few million years, it's going to give this planet hell.
		}
	}
	@Body[Otempta]
	{
		@Properties
		{
			%description = This object is <color=#ff0000>EXCEPTIONALLY SMALL!</color>\n\nOtempta lives in the middle of Limnus' sooty dusty ring system. It seems to be cobbled together haphazardly, one wonders how much further such an object could get to Limnus before it falls apart . . . well, the rings on either side suggest the answer is "not much."

		}
	}
	@Body[Trendle]
	{
		@Properties
		{
			%description = This object is <color=#ff0000>EXCEPTIONALLY SMALL!</color>\n\nTrendle is an odd satellite, its shape and proximity to Limnus means its appearance differs significantly for observers at different latitudes. Sometimes it looks very ordinary, sometimes it seems very long, and some times it seems like two objects entirely! Trendle seems to be a delicate pair of conjoined objects, just barely holding on to each other at the edge of the roche limit.
		}
	}
	@Body[Pheber]
	{
		@Properties
		{
			%description = Pheber is the first notable moon beyond Limnus' dust rings, and  Limnus' second largest moon by a fair margin. Pheber is the closest world to Limnus large enough that an operation could occur without having to contend with absolutely pathetic microgravity, though this is not to say Pheber's surface gravity is objectively significant, only relatively so! Pheber's reddish coloration and various dramatic impact basins give it a unique flare among the other "drabber" moons, this along with its easy-to-spot nature and slow-ish speed across the Limnusean sky make it a popular target for young astronomers.

		}
	}
	@Body[Phenix]
	{
		@Properties
		{
			%description = Phenix is the queen of the Limnusean sky. It dominates the heavens, snuffs the light of Haun regularly, and lines within Limnus' sedimenary rocks are attributed to it. It has been measured that Phenix drifts slowly towards Limnus year by year, and within some 90-100 million years, Phenix will cross an invisible barrier of tidal forces, where it will be torn to shreds under Limnus' gravity. There is no primoridal formation model that allows Phenix to form alongside Limnus, and survive with its rate of orbital decay to modern times. This temporal conflict, alongside the scattered small moons and rings of Limnus, tell a harrowing story. We're lucky to know Limnus as it is now. It was not, and will not, be such a forgiving world in future.

		}
	}
	
	@Body[Egress]
	{
		@Properties
		{
			%description = [PORTED FROM PREVIOUS BUILD]
		}
	}
}