@Kopernicus:HAS[!MagDesSettings]:AFTER[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Limnus]]]:AFTER[MagDes]
{
	@Body:HAS[#identifier[MagDes/Auox]]
	{
		@Properties
		{
			%description = Auox.
		}
	}
	
	@Body[Haun]
	{
		@Properties
		{
			%description = Haun is a K9V type main sequence star not unlike Vatki's sun, and indeed a great many number of stars in the Galaxy. It is not a flare star, and shows minimal variability; a stroke of luck that has made our existence as PIFIA possible.
		}
	}
	
	@Body[Irecula]
	{
		@Properties
		{
			%description = Telescopic observations of Irecula reveal a world that most likely shares substantial geophysical similarities to Ripley, though it remains to be seen whether tidal and stellar heating from Haun has led to prolonged volcanism in geologically modern times.
		}
	}
	@Body[Revel]
	{
		@Properties
		{
			%description = Revel
		}
	}
	
	@Body[Ollmi]
	{
		@Properties
		{
			%description = Ollmi
		}
	}
	@Body[Olimar]
	{
		@Properties
		{
			%description = Olimar
		}
	}
	
	@Body[Meir]
	{
		@Properties
		{
			%description = Much of what we know of Meir comes from our parent IMEI. After it arrived in the Haun system, it went to this planet first. Unfortunately shortly after arrival its maneuvering engine was damaged (likely due to random debris), ending the mission early. Meir is a Chitym-mass planet comprised of rock with an iron core, surrounded by a thick ocean made of water. It has a strong dynamo deflecting much of the solar wind and hindering detailed study of the magnetic field environment of the Haun system and beyond. We would also like to point out that it is a lovely shade of [color.rayleighscattering_meir].
		}
	}
	@Body[Ripley]
	{
		@Properties
		{
			%description = Ripley is our birthplace, after a fashion. When our parent entities, IMEI and PEVINI, fused to create PIFIA, we set down upon the nearest solid body. After some time constructing infrastructure and performing manufacturing experiments, we have finally found the means to pursue our missions. For the sake of IMEI: We will learn as much as we can about the Auox system and return that information to IMEI's homeworld Chitym. For the sake of PEVINI: We will make contact with any intelligences we may come across and share with them information about PEVINI's homeworld Vatki, as well as what we have learned of Auox, and, one day, construct self-replicating spacecrafts capable of continuing PEVINI's mission.\n\n Ripley itself is a fairly unique world, an airless rocky world with a large iron core, having been stretched by tidal forces from Meir into the shape of a triaxial ellipsoid. Although it would be more efficient from a space launch perspective to launch from the extreme ends of Ripley's major axis, we have had to relocate our operations to the leading hemisphere to avoid structural and thermal stresses resulting from   volcano.
		}
	}
	@Body[Neih]
	{
		@Properties
		{
			%description = Neih is the smaller classmate of Ripley. Telescopic investigations of the satellite show a surface similar in many respects to Ripley, featuring impact craters, multi-ring impact basins, and ancient lava seas. However, unlike Ripley, Neih shows no indication of volcanic activities.
		}
	}
	
	@Body[Limnus]
	{
		@Properties
		{
			%description = Limnus is the superior neighbor to Meir, and is 6.873±0.008 times less massive than it. It is orbited by a debris disk and a cohort of five small satellites. Limnus is presently one of the most important SEVI (Search for Extra-Vatki Intelligence) targets, for two reasons. One: IMEI observed a powerful spacecraft entering its sphere of influence several hundred years ago. Two: From a distance at least, it resembles the sort of world depicted by PEVINI's Vatki cultural database. All attempts to communicate with intelligences on or near Limnus using our communication LASERs have thus far failed.
		}
	}
	@Body[Phenom]
	{
		@Properties
		{
			%description = This object is <color=#ff0000>EXCEPTIONALLY SMALL!</color> Exceptionally small objects are bodies with only one biome, and low scientific returns. Sometimes they're nearby larger objects, or in groups with other small bodies. A mission dedicated to just one of them might not have good returns, but as part of a larger whole, they can make for a nice piece of bonus science.\n\nPhenom is the innermost natural satellite of Limnus. Existing beneath the rings but still evidently solid, it is remarkable that it exists at all--tidal forces should have long ago disrupted it. Based on long term telescopic measurements as well as tidal modelling, it is likely to impact Limnus within several million years.
		}
	}
	@Body[Otempta]
	{
		@Properties
		{
			%description = This object is <color=#ff0000>EXCEPTIONALLY SMALL!</color>\n\Not much is known of Otempta aside from its apparent brightness and its orbit, which occupies a gap in Limnus' rings.

		}
	}
	@Body[Trendle]
	{
		@Properties
		{
			%description = This object is <color=#ff0000>EXCEPTIONALLY SMALL!</color>\n\nNot much is known of Trendle aside from its apparent brightness and its orbit, just beyond Limnus' rings.
		}
	}
	@Body[Pheber]
	{
		@Properties
		{
			%description = Not much is known of Phenom aside from its apparent brightness and its orbit, just beyond Limnus' rings.

		}
	}
	@Body[Phenix]
	{
		@Properties
		{
			%description = The largest moon of Limnus--and the only one observed by IMEI--is observed to have a shortening period, getting faster year after year. Under the assumption that Limnus is not presently accreting large amounts of mass, the leading hypothesis is that tidal drag is pulling Phenix and Limnus closer together over time. This implies Phenix must not have formed alongside Limnus. Perhaps it is related to Limnus' debris disk?

		}
	}
	
	@Body[Egress]
	{
		@Properties
		{
			%description = Egress is like nothing known to either Vatki culture or Chitym science. It seems to be a miniature star, with the same H2- and He-rich composition as Haun, but substantially smaller and far less massive. Remarkably, there is no evidence of a stellar engine inside its core. Unlike stars, its optically opaque surface is dominated by aerosols rather than plasma, so study of the object could utilize meteorological rather than astrophysical methods. We are of two minds about whether to classify this object as a planet or a star. PEVENI would have liked us to classify it, while IMEI would have preferred not to classify it, and to leave categorization to the scientists of its homeworld.
		}
	}
}