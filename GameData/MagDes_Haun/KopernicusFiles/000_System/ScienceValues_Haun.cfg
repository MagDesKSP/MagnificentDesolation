@Kopernicus:FOR[MagDesScience]
{
	
	//IRL Mission Order:
	//Earth (57), Moon (59), Solar Orbit (60), Venus (62), Mars (64), Jupiter (L72 A73), Saturn (L73 A79), Mercury (73), Comet (78), Asteroid (89), NEO (96), Pluto & Arrokoth 06), Ceres & Vesta (06)
	
	//KSP RecoveryValue Order: 
	//1: Kerbin
	//2: Mun
	//2.5: Minmus
	//4: Sun
	//5: Eve, Duna, Ike
	//6: Gilly, Dres, Jool
	//7: Moho
	//8: Laythe, Vall, Tylo, Bop, Pol
	//10: Eeloo
	
	//RecoveryValue Order:
	//1: Homeworld (Handle in Homeworld-specific config.)
	//2: Minor Homeworld Moons (Handle in Homeworld-specific config.)
	//3: Major Homeworld Moons (Handle in Homeworld-specific config) and Haun.
	
	//4: Meir or Limnus, near-homeworld asteroids.  (value ~4)
	//5: Olimar, Ollmi, & Revel (value ~5)
	
	//6: Irecula & Egress, asteroids. (value 6)
	//7: Auox (high space) (value 7)
	//8: Giant Planets beyond Egress (value 7-9)
	//9: Dwarf planets beyond giant planets. (value 11)
	
	//10: Pentus & Rengal
	//11: Ada & Leve
	//12: Kona & Kareen
	//13: Helva
	
	@Body[Haun]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				flyingLowDataValue = 15 // Science multiplier for flying low science.
				flyingHighDataValue = 12 // Science multiplier for flying high science.
				inSpaceLowDataValue = 11 // Science multiplier for in space low science.
				inSpaceHighDataValue = 2 // Science multiplier for in space high science.
				recoveryValue = 3
				flyingAltitudeThreshold = 18000 // Altitude when "flying at <body>" transitions from/to "from <body>'s upper atmosphere"
				spaceAltitudeThreshold = 1E+09 // Altitude when "in space low" transitions from/to "in space high"
			}
		}
	}
	@Body[Irecula]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				//Irecula is in a difficult to reach orbit and might suffer a bit from Moho Dres and Eeloo Syndrome.
				//People tend to be less interested in going to lonely moonless airless worlds, especially if they are difficult to reach.
				//So I'm boosting its science rewards as an incentive to make sure people care to give it a visit.
				landedDataValue = 12
				inSpaceLowDataValue = 9.5
				inSpaceHighDataValue = 8
				recoveryValue = 6
				spaceAltitudeThreshold = 65000 //I made low space science awful juicy so i'm gonna make you work for it.
			}
		}
	}
	
	@Body[Revel]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 8.5 //higher value than Ollmi since landing requires a little more care and effort here.
				flyingLowDataValue = 6
				flyingHighDataValue = 6
				inSpaceLowDataValue = 7
				inSpaceHighDataValue = 5
				recoveryValue = 5
				flyingAltitudeThreshold = 20000
				spaceAltitudeThreshold = 320000
			}
		}
	}
	
	@Body[Ollmi]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 7.5
				splashedDataValue = 7.8
				flyingLowDataValue = 5
				flyingHighDataValue = 5
				inSpaceLowDataValue = 7
				inSpaceHighDataValue = 5
				recoveryValue = 5
				flyingAltitudeThreshold = 30000
				spaceAltitudeThreshold = 150000
			}
		}
	}
	@Body[Olimar]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 6
				inSpaceLowDataValue = 4
				inSpaceHighDataValue = 4
				recoveryValue = 5
				spaceAltitudeThreshold = 20000
			}
		}
	}
	
	@Body[Meir]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 9
				splashedDataValue = 7.3
				flyingLowDataValue = 6
				flyingHighDataValue = 4.5
				inSpaceLowDataValue = 6
				inSpaceHighDataValue = 4.5
				recoveryValue = 4
				
				
				flyingAltitudeThreshold = 35000
				spaceAltitudeThreshold = 3000000 //slightly below Ripley
			}
		}
	}
	@Body[Ripley]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 7
				splashedDataValue = 7
				flyingLowDataValue = 0.25
				flyingHighDataValue = 0.25
				inSpaceLowDataValue = 6
				inSpaceHighDataValue = 5
				recoveryValue = 5
				flyingAltitudeThreshold = 22000 //if you want this science you gotta go down to the poles.
				spaceAltitudeThreshold = 80000 //this more or less corresponds to 'stable orbit'. There's not much room in Ripley's SOI for a more conventional space altitude threshold, so spacelow can be thought of as 'suborbital' and spacehigh as 'any halfway stable orbit'
			}
		}
	}
	@Body[Neih]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 7
				splashedDataValue = 8.5 //lava is difficult to survive with. if you can manage to get lava data that should be rewarded!
				inSpaceLowDataValue = 6.5
				inSpaceHighDataValue = 5
				recoveryValue = 5
				spaceAltitudeThreshold = 60000 //For parity with stock Mun
			}
		}
	}
	
	@Body[Limnus]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				//values currently set to be the same as stock Duna. To be tweaked later for parity with other worlds!
				landedDataValue = 8
				splashedDataValue = 8
				flyingLowDataValue = 5
				flyingHighDataValue = 5
				inSpaceLowDataValue = 7
				inSpaceHighDataValue = 5
				recoveryValue = 5
				
				flyingAltitudeThreshold = 25000
				spaceAltitudeThreshold = 165050 //Phenom's Orbital Altitude
			}
		}
	}
	@Body[Phenom]
	{
		%contractWeight = 15
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 1
				inSpaceLowDataValue = 1
				inSpaceHighDataValue = 1
				recoveryValue = 5
				spaceAltitudeThreshold = 4500
			}
		}
	}
	@Body[Otempta]
	{
		%contractWeight = 15
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 1
				inSpaceLowDataValue = 1
				inSpaceHighDataValue = 1
				recoveryValue = 5
				spaceAltitudeThreshold = 3500
			}
		}
	}
	@Body[Trendle]
	{
		%contractWeight = 15
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 1
				inSpaceLowDataValue = 1
				inSpaceHighDataValue = 1
				recoveryValue = 5
				spaceAltitudeThreshold = 6500
			}
		}
	}
	@Body[Pheber]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 6
				inSpaceLowDataValue = 4
				inSpaceHighDataValue = 4
				recoveryValue = 5
				spaceAltitudeThreshold = 24500
			}
		}
	}
	@Body[Phenix]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				landedDataValue = 7
				inSpaceLowDataValue = 6
				inSpaceHighDataValue = 5
				recoveryValue = 5
				spaceAltitudeThreshold = 24500
			}
		}
	}
	
	@Body[Egress]
	{
		@Properties
		{
			!ScienceValues{}
			ScienceValues
			{
				flyingLowDataValue = 12
				flyingHighDataValue = 9
				inSpaceLowDataValue = 7
				inSpaceHighDataValue = 6
				recoveryValue = 6
				flyingAltitudeThreshold = 50000
				spaceAltitudeThreshold = 1200000
			}
		}
	}
}