@Kopernicus:HAS[!MagDesSettings]:AFTER[MagDesScience]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Limnus]]]:AFTER[MagDesScience]
{
	//RecoveryValue Order (not actual values):
	//1: Homeworld
	//2: Minor Homeworld Moons
	//3: Major Homeworld Moons and Haun.
	
	@Body[Limnus]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 0.3 
				%splashedDataValue = 0.4
				%flyingLowDataValue = 0.5
				%flyingHighDataValue = 0.5
				%inSpaceLowDataValue = 0.5
				%inSpaceHighDataValue = 1
				%recoveryValue = 1
			}
		}
	}
	@Body[Phenom]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 0.05
				%inSpaceLowDataValue = 0.05
				%inSpaceHighDataValue = 0.05
				%recoveryValue = 1.1
			}
		}
	}
	@Body[Otempta]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 0.05
				%inSpaceLowDataValue = 0.05
				%inSpaceHighDataValue = 0.05
				%recoveryValue = 1.1
			}
		}
	}
	@Body[Trendle]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 0.05
				%inSpaceLowDataValue = 0.05
				%inSpaceHighDataValue = 0.05
				%recoveryValue = 1.1
			}
		}
	}
	@Body[Pheber]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 2
				%inSpaceLowDataValue = 1.7
				%inSpaceHighDataValue = 1.5
				%recoveryValue = 2
			}
		}
	}
	@Body[Phenix]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 3
				%inSpaceLowDataValue = 2
				%inSpaceHighDataValue = 1.5
				%recoveryValue = 2.5
			}
		}
	}
}