@Kopernicus:HAS[!MagDesSettings]:AFTER[MagDesScience]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Ripley]]]:AFTER[MagDesScience]
{
	//RecoveryValue Order (not actual values):
	//1: Homeworld
	//2: Minor Homeworld Moons
	//3: Major Homeworld Moons and Haun.
	
	@Body[Meir]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 6 //landing on icebergs is an extra challenge and should be rewarded as such.
				%splashedDataValue = 4.5
				%flyingLowDataValue = 3
				%flyingHighDataValue = 1
				%inSpaceLowDataValue = 1
				%inSpaceHighDataValue = 2
				%recoveryValue = 2
				
				%spaceAltitudeThreshold = 1200000 //Moved to be substantially lower than Ripley's orbit.
			}
		}
	}
	@Body[Ripley]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 0.3
				%flyingLowDataValue = 0.125
				%flyingHighDataValue = 0.125
				%inSpaceLowDataValue = 0.5
				%inSpaceHighDataValue = 1
				%recoveryValue = 1
				//recovery is actually a little harder on Ripley than Kerbin or even Limnus. 
			}
		}
	}
	@Body[Neih]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 4
				%splashedDataValue = 6 //lava is hot!
				%inSpaceLowDataValue = 3
				%inSpaceHighDataValue = 2
				%recoveryValue = 3
			}
		}
	}
}