			description = There is an old story in Redefinitionist mythology about a village under threat from a great and powerful dragon. Reluctant but seeing no other course of action, a woman stepped forward to face the dragon, all on her own. The journey to meet the dragon, and eventually slay it, was treacherous to both body and mind in equal part. The lonely path of destiny changed the hero forever, all the way down to her soul. When they returned to their village, the head of the beast limp upon a wooden cart behind their horse, they returned in victory. But he returned not as the woman who swallowed fear to change fate, but as the man who succeeded and was changed by fate in turn. That hero's name, his new name, was Revel. Born in flame, defined by himself alone.\n\nRevel is the second innermost planet of Haun, we know it's very red and only a touch smaller than Limnus. Albedo features reported by astronomers imply either a diverse surface or an overactive imagination.
