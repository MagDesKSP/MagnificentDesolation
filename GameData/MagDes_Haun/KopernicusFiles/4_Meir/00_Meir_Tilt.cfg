@Kopernicus:FOR[zMagDes]:NEEDS[TiltEm]
{
    // Declination = 90 degrees - Inclination
	// Right Ascension = Longitude of Ascending Node - 90 degrees
	 
	// Inclination = 90 degrees - Declination
	// Longitude of Ascending Node = Right Ascension + 90 degrees
	@Body[Meir]
    {
        @Properties
        {
            poleRA = 140
            poleDec = 59.47 //approx tilt: 30 degrees
        }
    }
	@Body[Ripley]
	{
		@Properties
		{
			tiltRelativeToParent = true 
			poleRA = 133
            poleDec = 89.1
		}
		@Orbit
		{
			relativeToParent = True
		}
	}
	@Body[Neih]
	{
		@Properties
		{
			poleRA = 125.7
			poleDec = 83.4 //approx tilt: 7 degrees.
		}
		@Orbit
		{
			inclination = 2.5
			longitudeOfAscendingNode = 156
		}
	}
}