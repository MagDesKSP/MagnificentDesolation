@Kopernicus:FOR[MagDes]
{
	Body
	{
		name = Ripley
		identifier = MagDes/Ripley
		cacheFile = MagDes_Haun/Cache/Ripley.bin
		Template
		{
			name = Mun //replace with Kerbin, so we get groundstations, at your liesure.
			//removePQSMods = remove all the same PQSMods that Limnus does
			
		}
		SpaceCenter
		{
			//PQSCity
			latitude = 0
			longitude = 0
			repositionToSphereSurface = true
			repositionToSphereSurfaceAddHeight = true
			repositionRadiusOffset = -20
			//Fix added for induced rotation
			reorientToSphere = true
			reorientFinalAngle = 270
			
			//MapDecal 
			decalLatitude = 0
			decalLongitude = 0
			heightMapDeformity = 2500
			absoluteOffset = 0
			absolute = true
			radius = 8500

			//Ground Materials
			groundColor = 0.5,0.5,0.5,1
			groundTexture = BUILTIN/ksc_exterior_terrain_ground
		}
		Properties
		{
			// spherical gravity = 0.42989 g.
			// spherical radius = 0.45552 R_Earth.
			// R_pole (c) = 0.420408 R_Earth.
			// R_ends (a) = 0.534786 R_Earth.
			
			
			radius = 6371000 //Earth radius
			@radius *= 0.420408 //Polar radius of Riddic in Earth radii.
			@radius *= 0.1 //Rescale
			//radius      = 267,841.9368 m
			//maxradius   = 340,712.1606 m
			//maxaltitude =  72,870.2238 m
			
			//density = 5200
			
			description = contact light. contact with what? that's right--contact with the foucking ROCHED LIMIT!
			
			gravParameter = 3.9860043543609598e+14 //earth's GM.
			@gravParameter *= 0.01 //Rescale
			@gravParameter *= 0.0892 //Riddic's mass in M_earth.
			
			initialRotation = 270
		}
		Orbit
		{
			referenceBody = MagDes/Meir
			semiMajorAxis = 3363519.2 
			eccentricity = 0.0231
			longitudeOfAscendingNode = 119
			argumentOfPeriapsis = 109
			meanAnomalyAtEpochD = -54.6
			inclination = 0.089
		}
		PQS
		{
			Mods
			{
				VertexHeightOblateAdvanced
				{
					oblateMode = CustomEllipsoid
					a = 1.27206428
					b = 1.08351887
					c = 1.00000000
					order = 99999999
				}
			}
		}
	}
}