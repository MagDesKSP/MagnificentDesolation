@Kopernicus:FOR[MagDes]
{
	Body
	{
		name = Ripley
		identifier = MagDes/Ripley
		cacheFile = MagDes_Haun/Cache/Ripley.bin
		Template
		{
			name = Mun //replace with Kerbin, if you want ground stations. But honestly, no ground stations would be kinda cool, gives an extra bit of difficulty, and solves a few other issues too.
			
			//removePQSMods = PQSMod_VertexHeightMap,PQSMod_VertexRidgedAltitudeCurve,PQSMod_VertexSimplexHeightAbsolute,PQSMod_VertexHeightNoiseVertHeightCurve2,PQSLandControl,PQSTextureAtlas //Use this instead of removeAllPQSMods if you use a Kerbin template, to preserve ground stations and such things.
			
		}
		SpaceCenter
		{
			//PQSCity
			latitude = 0
			longitude = 0
			repositionToSphereSurface = true
			repositionToSphereSurfaceAddHeight = true
			repositionRadiusOffset = -20
			//Fix added for induced rotation
			reorientToSphere = true
			reorientFinalAngle = 270
			
			//MapDecal 
			decalLatitude = 0
			decalLongitude = 0
			heightMapDeformity = 2500
			absoluteOffset = 0
			absolute = true
			radius = 8500

			//Ground Materials
			groundColor = 0.26,0.29,0.3,1
			groundTexture = BUILTIN/ksc_exterior_terrain_ground
		}
		Properties
		{
			// spherical gravity = 0.42989 g.
			// spherical radius = 0.45552 R_Earth.
			// density = 5200
			// R_pole (c) = 0.420408 R_Earth.
			// R_ends (a) = 0.534786 R_Earth.
			
			
			radius = 6371000 //Earth radius
			@radius *= 0.420408 //Polar radius of Riddic in Earth radii.
			@radius *= 0.1 //Rescale
			
			
			//reference ellipsoid heights (not including terrain height):
			//polar radius= 267,841.9368 m
			//Leading rad = 290,211.7927 m
			//Leading alt =  22,369.8559 m
			//maxradius   = 340,712.1606 m
			//maxaltitude =  72,870.2238 m 
			
			
			//  Gravity Table  : True Gravity | Effective Gravity
			// Nearside/Farside: 0.304 g      | 0.281 g
			// Leading/Trailing: 0.423 g      | 0.404 g
			// North/South Pole: 0.483 g      | 0.483 g
			//
			// Measurements done on the Farside, Leading, and North Pole, empirically in-game with the Mun template, 
			// and therefore may vary slightly when the final terrain is in, or from one side to its antipode.
			
			description = contact light. contact with what? that's right--contact with the foucking ROCHED LIMIT!
			
			gravParameter = 3.9860043543609598e+14 //earth's GM.
			@gravParameter *= 0.01 //Rescale
			@gravParameter *= 0.0892 //Ripley's mass in M_earth.
			
			initialRotation = 270
			
			ScienceValues
			{
				landedDataValue = 7
				splashedDataValue = 7
				flyingLowDataValue = 0.25
				flyingHighDataValue = 0.25
				inSpaceLowDataValue = 6
				inSpaceHighDataValue = 5
				recoveryValue = 1
				flyingAltitudeThreshold = 22000 //if you want this science you gotta go down to the poles.
				spaceAltitudeThreshold = 80000 //this more or less corresponds to 'stable orbit'. There's not much room in Ripley's SOI for a more conventional space altitude threshold, so spacelow can be thought of as 'suborbital' and spacehigh as 'any halfway stable orbit'
			}
		}
		Orbit
		{
			referenceBody = MagDes/Meir
			semiMajorAxis = 3363519.2 
			eccentricity = 0.0231
			inclination = 0.089
			longitudeOfAscendingNode = 119
			argumentOfPeriapsis = 109
			meanAnomalyAtEpochD = -54.6
			
		}
		ScaledVersion
		{
			fadeStart = 55000
			@fadeStart += 73000
			fadeEnd = 60000
			@fadeEnd += 73000
			OnDemand
			{
				texture = MagDes_Haun/KopernicusFiles/4_Meir/PluginData/Ripley_Color.dds
				normals = MagDes_Haun/KopernicusFiles/4_Meir/PluginData/Ripley_Normal.dds
			}
			VertexColorMapEmissive
			{
				blendMode = Additive
				map = MagDes_Haun/KopernicusFiles/4_Meir/PluginData/Ripley_Emissive.dds
				brightness = 1
			}
		}
		PQS
		{
			fadeStart = 60000
			@fadeStart += 73000
			fadeEnd = 120000
			@fadeEnd += 73000
			deactivateAltitude = 120750
			@deactivateAltitude += 73000
			Mods
			{
				VertexColorMapEmissive
				{
					blendMode = Additive
					map = MagDes_Haun/KopernicusFiles/4_Meir/PluginData/Ripley_Emissive.dds
					brightness = 1
				}
				VertexHeightOblateAdvanced
				{
					oblateMode = CustomEllipsoid
					a = 1.27206428
					b = 1.08351887
					c = 1.00000000
					order = 99999999
				}
				AltitudeAlpha
				{
					atmosphereDepth = 81000
					invert = False
					order = 999999999
					enabled = True
					name = _Material_ModProjection
				}
				VertexMitchellNetravaliHeightMap
				{
					map = MagDes_Haun/KopernicusFiles/4_Meir/PluginData/Ripley_Elevation.dds
					offset = 0
					deformity = 5300
					scaleDeformityByRadius = False
					order = 1
					enabled = True
					B = 1
					C = 0
				}
				AltitudeAlpha
				{
					atmosphereDepth = 81000
					invert = False
					order = 999999999
					enabled = True
					name = _Material_ModProjection
				}
			}
		}
		
	}
}