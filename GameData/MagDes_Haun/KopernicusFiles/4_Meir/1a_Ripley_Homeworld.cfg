@Kopernicus_config:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus_config:HAS[@MagDesSettings:HAS[#Homeworld[Ripley]]]:FOR[MagDes]
{
	@HomeWorldName = Ripley
}
@Kopernicus:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Ripley]]]:AFTER[MagDes]
{
	@Body[Ripley]
	{
		@Properties
		{
			%isHomeWorld = True
		}
		SpaceCenter
		{
			//PQSCity
			latitude = 0
			longitude = 0
			repositionToSphereSurface = true
			repositionToSphereSurfaceAddHeight = true
			repositionRadiusOffset = -20
			//Fix added for induced rotation
			reorientToSphere = true
			reorientFinalAngle = 270
			
			//MapDecal 
			decalLatitude = 0
			decalLongitude = 0
			heightMapDeformity = 2500
			absoluteOffset = 0
			absolute = true
			radius = 8500

			//Ground Materials
			groundColor = 0.26,0.29,0.3,1
			groundTexture = BUILTIN/ksc_exterior_terrain_ground
		}
	}
}