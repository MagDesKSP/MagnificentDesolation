@Kopernicus_config:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus_config:HAS[@MagDesSettings:HAS[#Homeworld[Ripley]]]:FOR[MagDes]
{
	@HomeWorldName = Ripley
}
@Kopernicus:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Ripley]]]:FOR[MagDes]
{
	@Body[Ripley]
	{
		@Properties
		{
			%isHomeWorld = True
		}
	}
}