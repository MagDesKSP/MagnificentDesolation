@Kopernicus:HAS[!MagDesSettings]:AFTER[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Ripley]]]:AFTER[MagDes]
{
	@Body[Meir]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 6.5 //landing on icebergs is an extra challenge and should be rewarded as such.
				%splashedDataValue = 5.5
				%flyingLowDataValue = 3
				%flyingHighDataValue = 0.065
				%inSpaceLowDataValue = 0.045
				%inSpaceHighDataValue = 0.04
				%recoveryValue = 20
				//recoveryValue is a difficult problem for super-earths. Actually building a launch vehicle that can return from the surface takes incredible skill and is certainly 'late-game'.
				//But getting to the surface in the first place is usually not so difficult, and the space science should also not be super valuable, yet recoveryValue is for all situations, not just srfLanded or srfSplashed.
				//So in this case I am using a very high recovery value and very low values for everything except landed and splashed.
				
				%spaceAltitudeThreshold = 1200000 //Moved to be substantially lower than Ripley's orbit.
			}
		}
	}
	@Body[Ripley]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 0.15
				%flyingLowDataValue = 0.0625
				%flyingHighDataValue = 0.0625
				%inSpaceLowDataValue = 0.25
				%inSpaceHighDataValue = 0.5
				%recoveryValue = 2 
				//recovery is actually a little harder on Ripley than Kerbin or even Limnus. 
				//All other values are halfed to accomodate a higher recoveryValue.
			}
		}
	}
	@Body[Neih]
	{
		@Properties
		{
			@ScienceValues
			{
				%landedDataValue = 4
				%inSpaceLowDataValue = 3
				%inSpaceHighDataValue = 2
				%recoveryValue = 2.5
			}
		}
	}
}