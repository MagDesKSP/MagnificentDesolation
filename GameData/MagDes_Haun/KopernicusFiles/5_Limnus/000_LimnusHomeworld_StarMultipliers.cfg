@Kopernicus:HAS[!MagDesSettings]:AFTER[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Limnus]]]:AFTER[MagDes]
{
	@Body:HAS[@Template:HAS[#name[Sun]]] //target every star.
	{
		// @Properties
		// {
			// @description = if you see this ingame, please go to GameData/MagDes_Haun/KopernicusFiles/5_Limnus/000_LimnusHomeworld_StarMultipliers.cfg and remove the line that matches this text. I'm just using it as a visual test.
		// }
		@ScaledVersion
		{
			@Light
			{
				//In star configs, luminosity has been defined in terms of watts per square meter at 1 au.
				//It must now be reduced by the ratio of the instellation of Limnus to the insolation of Earth.
				//Limnus orbits at 0.416 around a star of luminosity 0.079 Lsol.
				//for these calculations the rescale factor should not matter.
				//Relative to Earth, instellation will go with the inverse square of the ratio of the distances, so:
				//0.416^-2 = 5.77847633
				//Since instellation has already been scaled by luminosity, this value is sufficient.
				
				@luminosity *= 5.77847633
			}
		}
	}
}