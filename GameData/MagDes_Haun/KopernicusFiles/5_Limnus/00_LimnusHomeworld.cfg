@Kopernicus_config:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus_config:HAS[@MagDesSettings:HAS[#Homeworld[Limnus]]]:FOR[MagDes]
{
	@HomeWorldName = Limnus
}
@Kopernicus:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Limnus]]]:AFTER[MagDes]
{
	@Body[Limnus]
	{
		@Properties
		{
			%isHomeWorld = True
		}
		SpaceCenter
		{
			latitude = -0.015
			longitude = -174.5
			repositionRadiusOffset = -19
			reorientFinalAngle = 84

			decalLatitude = 0.1
			decalLongitude = -174.4
			heightMapDeformity = 2
			radius = 4000
			angle = 89.5

			groundColor = 0.639,0.565,0.529,1
			groundTexture = BUILTIN/ksc_exterior_terrain_ground
			removeScatter = true
		}
	}
}