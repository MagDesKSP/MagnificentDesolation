@Kopernicus_config:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus_config:HAS[@MagDesSettings:HAS[#Homeworld[Limnus]]]:FOR[MagDes]
{
	@HomeWorldName = Limnus
}
@Kopernicus:HAS[!MagDesSettings]:FOR[MagDes]
{
	#@MagDesSettings {}
}
@Kopernicus:HAS[@MagDesSettings:HAS[#Homeworld[Limnus]]]:FOR[MagDes]
{
	@Body[Limnus]
	{
		@Properties
		{
			%isHomeWorld = True
		}
	}
}