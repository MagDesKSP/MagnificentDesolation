//Limnus is 6 billion years old, and has been scarred by four different impact events over its history due to the recycling of its largest moon, Phenix. 
//The moonfalls which occured at 5.5 GYA, 4.5 GYA, 2 GYA, and 100 MYA mark the end of the Novformic, Vetustic, Satusanimic, and Effectic Eras respectively. The modern era of Limnus is called the Sepulchrum Era.
//Most of Limnus' history had the planet's spin in a tidal lock 1:1 with its orbit around Haun however from the mid-Satusanimic Era to early Effectic Era Limnus was in a 3:2 Spin:Orbit resonance (3.5 to 1.5 GYA)
//This is because of mass concentrations moving around within Limnus' interior, remnants of the impactor that formed the Limnusean moon system. Without a stablizing large moon like Earth, these mass cons are sufficient to allow Limnus to enter periods of axial instability.
//During the Resonant Rotation Period from 3.5 to 1.5 GYA Limnus' sea level was far higher due to better heat distribution preventing the formation of a large anthaunian ice sheet.

//Limnus has 18 biomes:
				//NearSideOceans
				//FarSideOceans
				//NearSideTerrain
				//FarSideTerrain
				//Mountains
				//RedDeserts
				//NearsideTundras
				//GlacialHighlands
				//BigHawaii
				//Volcanoes
				//Seaice
				//Antistellarcap
				//Shores
				//10MYACraters
				//2GYACraters
				//4dot5GYACraterSpecial
				//4dot5GYACraters
				//Ejecta


@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				InSpaceHigh = The majesty of Limnus and her entourage cannot be overstated. In a glance, the view brings so many ideas you've always known to be true together. You think back to the graphics in textbooks where Limnus is depicted as a blank encircled by arcing paths of rings and satellites. You recall every map you've seen time and time again of Limnus' continents, the structures and coastlines and craters. You imagine the clouds which hang over the ocean from the space center. All of these things exist, and that isn't a surprise to you, but the sight is unbelievable all the same. The only thing you can't see, even from here, are borders.
				InSpaceLow = To commemorate your successful trip to space, you read an exert from the Third Book of Redefinition: "From her rocky shore, perched above the perpetual pounding waves, Limnus the little goddess, carrying in her heart the epithet of hope, continued to tend her lighthouse. Her beacon of light meant to guide the weary and weak away from the jagged rocks as they made their way towards Haun's great garden. On her shoulders, she believed, rested a brighter future."
				SrfLanded = Feels like we're in a stable condition. Weather readings aren't too bad either! The sound of the breeze on the outside of the spacecraft is faint but noticeable, and you can't help but wonder if you should have packed that extra sweater.
				SrfSplashed = Another happy landing! You wonder how much swimming you can get in before the recovery team gets here.
				Flying = You make sure to give active feedback on the handling of the vehicle, you try not to be too harsh but some things really can't be helped.
				FlyingHigh = From this vantage point the structure of the land and sea is truly a sight to behold! Gorgeous vistas from the edge of space.
				
				FlyingLowNearSideOceans = The water below is dominated by shimmering waves which are becoming a very distracting visual for the pilot. 
				FlyingLowFarSideOceans = You can barely make out the crests of waves as starlight glints off of them. As long as they're below you, you figure, things will be just fine.
				FlyingLowNearSideTerrain = The jagged, rough surface of Limnus is much more apparent as you soar over the surface. Throughout these ages of change that Limnus has gone through, the staggering natural beauty of the planet has remained. There is much to learn, so much more to learn.
				FlyingLowMountains = You make sure the speedometer and altimeter are in your periphery vision at all times. Limnus' atmosphere makes maintaining a level high altitude flight difficult. Not impossible! But difficult. You saw your fair share of failed designs die on the drawing board.
				FlyingLowRedDeserts = The rich color of the terrain in contrast with surrounding mountains makes you feel at home.
				FlyingLowNearsideTundras = Despite the cold temperatures, these regions make for some of the better places to grow crops on Limnus due to their persistent sunlight and moisture.
				FlyingLowFarSideTerrain = It's very dark out there. You know very well that no animal life is known to live anywhere but the veil of darkness lets your imagination run wild.
				FlyingLowGlacialHighlands = You see the shape of terrain against the sky, you make extra sure that the plane's altitude to safe.
				FlyingHighFarSideTerrain = Not many people live on this side of the planet, where darkness is more or less perpetual aside from ringshine and light reflecting off Limnus' satellites. You can see the faint flicker of artificial lights, maybe fires, among the snow.
				FlyingLowBigHawaii = All those caldera, the geologist in you is astonished by how many people live here! There's no denying its beauty of course.
				FlyingLowVolcanoes = You watch steam rise from the caldera and several smaller regions across the volcanoes' slopes.
				FlyingLowSeaice = You know landing wouldn't exactly be easy for a number of reasons, but the nice and flat ice sheets might make this easier than a landing on continental terrain, as long as you ignore everything else about landing on an iceberg.
				FlyingLowAntistellarcap = You trace out the snaking cracks in the ice with your eyes. This is the largest ice sheet on all of Limnus, this part of the planet hasn't seen the sun in 1.5 billion years.
				FlyingLowShores = Limnus' sandy shores were the first evidence that Limnus has native life, but you can't understand why from up here. One thing you are sure of: you can't wait for the beach episode.
				FlyingLow10MYACraters = You can tell so clearly that this is a crater as you trace the concentric peaks along the horizon, but it's also somewhat unfair because you were told in training you'd be surveying a crater today.
				FlyingLow2GYACraters = The sands of time are trying to bury this crater from you, but they're absolutely not succeeding yet. You give an extensive visual report on the depth and width of the basin and its rim.
				FlyingLow4dot5GYACraterSpecial = Aside from a few islands... you're nervous there's not actually a crater here.
				FlyingLow4dot5GYACraters = You're not confident that you can actually distinguish the crater from the surrounding terrain. This encourages you to double check your coordinates to make sure you're in the right spot- your aerial observations however apparently make the cartographers back home very excited.
				FlyingLowEjecta = You record your observations on the orientation and stratification of the surrounding peaks, they all point towards a local impact basin that formed about 10 million years ago. This would make for an exciting hike.
				
				SrfLandedSeaice = You heard a deep, reverberating sound when your vehicle made contact with the ice, and it's not going away very quickly. It's like a constant barrage of distant snaps and whistles. You report the vehicle's situation as nominal through gritted teeth, but emphasise your concern with the choice of site.
				SrfLandedAntistellarcap = You heard a deep, reverberating sound when your vehicle made contact with the ice, and it's not going away very quickly. It's like a constant barrage of distant snaps and whistles. You report the vehicle's situation as nominal through gritted teeth, but emphasise your concern with the choice of site.
				SrfLandedBigHawaii = It wasn't especially easy to find a good landing spot, and the eruptions visible out the window make you somehow doubt the word "good" is accurate.
				SrfLandedShore = Many people love the beach, but xenobiologists especially love the beach. You make sure your sampling equipment is prepared and steralized. You're not going to find anything alive out there, but seashells on Limnus are prized scientific artifacts.
				SrfLandedVolcanoes = This is a good idea and you're so so so so glad to be a part of it yes this is great, very safe, you absolutely felt that tremor just now but you're not gonna think about it. Situation: nominal. The CAPCOM back home asks if you're lying and you smile and say no not at all.
				SrfLandedFarSideTerrain = You turn on the heater, it's so dark and cold on Limnus' "back." While the craft rests in the snowswept landscape, you reflect on the history of Limnus. You know that the people who came here were from a planet where time was defined by the rising and setting of the local star, but on Limnus such rising and setting is very localized, most of the planet knows only eternal day or eternal night - the very concept of "day" or "night" as times instead of locations you can go is somewhat strange.
				SrfLandedGlacialHighlands = You begin to break into a warm ration, it'll take time to come to temperature with the limited equipment within your cabin. While the craft rests in the frigid landscape, you reflect on the history of Limnus. Phenix has become the standard time keeping method for Limnus, because while there are many large moons that can be made out with the naked eye easily, Phenix is the only that is obviously a rough sphere, and has the highest period. You laugh, remembering an old historical argument about dividing time based on the orbit of *Phenom* since it's the most common to rise and set. Imagine a world so hectic you could WATCH time fall out of the sky.
				SrfLandedFarSideTerrain = The surface is jagged, cracked and glistens in the faint light of the satellites overhead. It seems that ice is threatening to break through the rocky soil. You make sure that the landing gear are secure, and turn on the cabin's heaters.
				SrfLandedMountains = You ponder how steep is wise for a surface like this, and briefly lament your other landing sites.
				SrfLandedRedDeserts = Thick, highly charged dust coats the exterior of your spacecraft, and you thank the engineers back home for installing windshield wipers on your cockpit windows.
				SrfLandedNearsideTundras = Limnus is desolate, but this feels extra desolate. You zip up your thermal layers and ponder how many additional layers you need to voyage outside.
				SrfLandedGlacialHighlands = The air is even thinner here outside of the cabin, and you double and triple check your gear. Jagged icy outflows dominate the landscape here, and you make sure you backed your crampons.
				SrfLandedBigHawaii = Staring into the great calderas is certainly a dizzying site, but the desolate beauty of everything around you is a comfortable reminder of where you are.
				
				SrfLanded10MYACraters = Well getting here was easy enough wasn't it? Time to do some serious geology! Mission control tells you to contain your enthusiasm.
				SrfLanded2GYACraters = It was a little bit out of the way, but still fairly easy to find. Mission control is happy to hear you've made it in one piece. Time to try and date these basins...
				SrfLanded4dot5GYACraterSpecial = Precisely done! Understanding these regions before they erode away into the ocean might not be especially time sensitive, but it's not easy either.
				SrfLanded4dot5GYACraters = You confirm with mission control, yes, you're at the crater, which is what this is. It is in fact a crater. Trust the geology team!
				SrfLandedEjecta = Landing on a mountain is an impressive feat on its own, but ones so gnarled? Very well done, says mission control. 
				SrfLandedNearSideTerrain = The barren, gravelly desert outside of your spacecraft seems neverending. This kind of desolation is a convincing argument for a movie night inside the warm and cozy cabin.

				SrfSplashedNearSideOceans = A warmer ocean at last! The water outside your cabin is still cold, but a significant improvement from other oceans seen across the planet. It would, however, be a rather chilly swim.
				SrfSplashedFarSideOceans = The surface of the water here is still and glassy, but the creep of frost on the cockpit walls and windows does cause a mild amount of concern. You take notes, and turn on the heaters.
				SrfSplashed10MYACraters = The crater atolls of the Limnusean equator are popular tourist destinations, and space program locations. It's good comfortable swimming for the day side, and good meteor-viewing for the nightside. You ask mission control if you can have a little extra time to enjoy the spot once on-duty astronaut business is over.
				SrfSplashed2GYACraters = You insist to mission control you were aiming for the water, it's gentler. Mission control seems to take your word for it.
				SrfSplashed4dot5GYACraterSpecial = Feels like normal water. Mission control confirms the water should be normal, it's what's below it that's so very interesting.
				SrfSplashed4dot5GYACraters = You confirm with mission control, yes, you're at the crater, which is what this is. It is in fact a crater. Trust the geology team!

				InSpaceLowNearSideOceans = The reflection of Haun's light on the surface is a strangely intimate thing. Limnus is a fragile world, and we're far from the first, last, or only beings which inhabit it. This world was spinning into being before Kerbin even formed.
				InSpaceLowFarSideOceans = The glimmer of Limnus' rings on the water below is an almost ghostly sight to behold. Limnus' sooty rings of dust and rock do very little to actually warm the backside of Limnus, an empty sky with only ringshine is famously not even enough to read out in the open.
				InSpaceLowNearSideTerrain = 6 billion years ago, Limnus was a young world still burning, we know this because we know the age of Haun, and know Limnus formed along side it.
				InSpaceLowFarSideTerrain = You're asked to describe the terrain as best you can by mission control. For a moment you're not even sure you can distinguish where the terrain is but as your eyes adjust you can just barely make out the jagged flows of glacial geology.
				InSpaceLowMountains = The mountains seem to fall near the intersection of Limnus' continental plates, where terrain is smashed together over geologic time scales. The rate at which continents move on Limnus is incredibly slow, and volcanism tends to be far more impactful on the planet's terrainforms.
				InSpaceLowRedDeserts = You describe the deserts below you as having an almost painterly quality of the red hues which stain the lowlying terrain. Localized dust storms in these regions make them poorly suited for some crops, but many people still call these regions home. You give a gentle wave from the window, knowing no one actually sees it.
				InSpaceLowNearsideTundras = Haunrise and Haunset from orbit is a surreal view. So this is what it's like to stand on worlds with stars that rise and set over the horizon, how beautiful! You try to make out fields of farmland on the world below. You wonder how plants ever survived in a world without constant light.
				InSpaceLowGlacialHighlands = To commemorate your successful trip to space, you read an exert from the Third Book of Redefinition: "From her rocky shore, perched above the perpetual pounding waves, Limnus the little goddess, carrying in her heart the epithet of hope, continued to tend her lighthouse. Her beacon of light meant to guide the weary and weak away from the jagged rocks as they made their way towards Haun's great garden. On her shoulders, she believed, rested a brighter future."
				InSpaceLowBigHawaii = You raise the possibility that the largest constituent island of Harstis is in fact a supervolcanic caldera and not an impact crater. At first mission control halfheartedly disregards your opinion. Not long after however they begin to ask you to explain why you think that way. The conversation is absolutely fascinating, scientifically speaking. However the space agency PR team is not quite sure how to handle the press releases for such a discovery.
				InSpaceLowVolcanoes = On Limnus, people tend to wear respirators, and one big part of that is because so much volcanic gas and dust can be circulated in its atmosphere at a given time. Most of this gets drawn out towards the Haunward Ocean, but that doesn't mean no hazard exists. Space-based monitoring will help us measure, predict, and warn people about impacts from volcanic activity.
				InSpaceLowSeaice = Limnus' climate is dominated by Haun being a stationary element in its sky. Limnus rotates once per Limad, and so heat circulation to its nightside is nearly nonexistent. Additionally, all the wind tends to blow towards the substellar point. The leaves a lot of cooler regions along Limnus' terminator where sea ice propagates. Observing how these icebergs evolve will be valuable for improving our climate models.
				InSpaceLowAntistellarcap = The structure of Limnus' antistellar ice cap is poorly recorded. When limited to purely ground or air based observations, it's hard to track the ice sheet even if it is mostly stagnant. From here the sprawling fractal network of icebergs is so clear, but not easily described verbally. Mission control is frustrated by this.
				InSpaceLowShores = You're on a very different kind of shore now. From space it may be possible to investigate how the coastlines shift over time. But for now you have a bigger task: figuring out all the ways in which the maps made prior to orbital spaceflight are wrong.
				InSpaceLow10MYACraters = You describe the specific structure of the craters, as the craft orbits it's almost hard to finish describing them before the next drifts into view. A science team down in mission control is having just as hard a time jotting down your observations in time. The more we know about the structure of these craters, the more our models of the impact events that formed them can be refined.
				InSpaceLow2GYACraters = These craters which drift apart from the Limnusean equator fall in a great arc across the planet's full disk. It is postulated that this arc fossilizes a previous equator Limnus once had, but how could the axis of the planet shift...? 
				InSpaceLow4dot5GYACraterSpecial = Well from this vantage point it couldn't be anymore obvious that that is in fact a crater. But it certainly doesn't align with the usual two primary crater belts. Perhaps it is far older, or completely unassociated with a Phenixfall?
				InSpaceLow4dot5GYACraters = It's hard to say it with confidence, but this roughly circular depression does appear similar to other, younger impact basins on Limnus. Geologists believe that if that is the case, they've been heavily distorted by continental drift and may be some of the oldest impact events on Limnus.
				InSpaceLowEjecta = You remark that it is almost like a flower, a rare thing to see on Limnus outside of specific botanical gardens. These great spokes represent material that was overturned by Limnus' most recent and violent Phenixfall which occurred 10 million years ago. 
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				SrfLanded = Shadows on Limnus can be very constant. Sure clouds and people walk across its surface and carry their shadows with them, but any static object, a rock, a building, a mountain - those shadows root themselves more or less in place. You've been told other planets which rotate freely with respect to Haun won't be so forgiving to your intuition of what objects are motion.
				SrfSplashed = Begin EVA suit hydromobility testing! Hey, this holds up surprisingly well! You can even tread water and stay afloat! You almost forget how heavy this spacesuit actually is without the help of bouyancy.
				FlyingHigh = An EVA at this altitude feels somehow more dangerous than a spacewalk. Now that you think about it, it most assuredly is. Freefall certainly wouldn't be perpetual here.
				InSpaceLow = You do your best to record your observations of Limnus' terrain and weather patterns, there are details your eyes can notice and fixate on better than a camera - but the process of trying to track the features is dizzying.
				InSpaceHigh = It's funny how small Limnus feels from up here, as you float outside your spacecraft. The rings feel so far away, and the moons you've come to know are nothing more than tiny blips. You triple check your to do list, and stare longingly back at the distant surface.
				
				FlyingLowFarSideOceans = You brace yourself for a cold punge as you get closer and closer to the dark waves below.
				FlyingLowNearSideTerrain = The thin air here registers as a strong breeze, which is comforting only for a moment. You seriously ponder getting back inside the cockpit and taking the controls.
				
				SrfLandedNearSideTerrain = The gravel crunches underneath your feet, and you take a moment to admire the strange and windswept terrain. You make a note that a picnic here would not be ideal.
				SrfLandedFarSideTerrain = Snow covered terrain dominates Limnus' nightside, but this snow is hard from fresh. Weather doesn't change, the sun never rises, it's nothing but permafrost as far as the icelands extend.
				SrfLandedVolcanoes = It's all worth it in the pursuit of science!! Limnus is very volcanically active, but as much as you feel you're in danger now, you try and imagine all the good nutrients these volcanoes enrich the soil with! Agriculture would be so much harder without them!
				SrfLanded10MYACraters = You can't help but look up at the thin line of the rings, and the large satellites which float inbetween the divisons. Those chunks aren't done falling yet, and watching how fast they can cross the sky reminds you just how fragile life here truly is.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				SrfSplashed = Limnus' hydrosphere rises and falls with the tides caused by its satellites, but the currents are relatively weak. Without purification, water on Limnus has a very hard gritty quality when you drink it.
				SrfLandedFarSideOceans = The water samples gathered from tidal pools are of a relatively clean compared to the samples from the nearside.
				SrfSplashedFarSideOceans = The water samples gathered are of a relatively clean compared to the samples from the nearside. Life that thrives in the deep oceans of Limnus' nightside are chemosynths which live on the ocean floor with a relatively small population and very slow metabolism. The chemical signatures of life are less pronounced.
				SrfLandedNearSideOceans = The water trapped in tidal pools is heavily contaminated by volcanic ash. It's unclear why life on Limnus is so very opposed to redeveloping photosynthesis...
				SrfSplashedNearSideOceans = The water is heavily contaminated by volcanic ash and dissolved gases, the former depositied by surface-side eruptions and the latter being introduced by deep sea thermal vents. Life thrives on this stuff, somehow. Meanwhile the Kerbal population relies heavily on water filtration to have a drop to drink.
				
				SrfLandedNearSideTerrain = Limnus' surface is very rich in igneous rock, and is fairly dry for a world with so much water. Limnus' nature as a tidally locked work means rainy weather very very rarely reaches far from the the subhaunian point.
				SrfLandedFarSideTerrain = Core samples of the permafrost contain records of Limnus' ancient past in the form of trapped atmospheric gases. 1.5 billion years ago this side of Limnus was far, far warmer, and the atmosphere was up to 22% oxygen.
				SrfLandedMountains = Within the strata, Limnus hosts record of several major cataclysms which blanketed the world in ejecta. Three dark lines in the sediment, all identical in composition. You find spiraling seashells which get carbon dated to 2.2 billion years ago, but this line of fossils is interrupted by one of these impenetrable barriers of time. The Primoflamma Extinction, 2 billion years ago, is believed to have been caused by a Phenixfall.
				SrfLandedRedDeserts = The deserts of Limnus are lousy with fossils from the Effectic Era, when Limnus was properly flourishing. Digging around for awhile, you manage to find a jagged tooth from a long forgotten animal and a slender trunk segment of a tree-like plant. The Exilium Extinction wiped Limnus' surface bare just 100 million years ago.
				SrfLandedNearsideTundras = The soil here is moist but nutrient pour. To start agriculture on Limnus, nutrients had to be introduced to the soil artificially... the means by which that was done were somewhat grim. You wonder if it's a blessing or a curse Kerbals didn't make it to Limnus before the Exilium Extinction.
				SrfLandedGlacialHighlands = Core sampling these glaciers allows for the analysis of trapped atmospheric samples, it seems about 1.5 billion years ago, Limnus had far more water vapor in its atmosphere. It seems that heat circulated more evenly across the planet in the distant past, implying Limnus wasn't locked facing Haun!
				SrfLandedBigHawaii = Carbon dating igneous samples of this island chain imply these volcanoes are generated by a hotspot deep within the Limnusean mantle. The oceanic plate Harstis lies on rotates in place, while new volcanoes form, grow, and eventually become extinct and erode back into the ocean as the crust passes above it. It's like a production line for big volcanoes.
				SrfLandedVolcanoes = Volcanic samples imply a material trace within the mantle that is somewhat similar to the mineral lines associated with the Phenixfalls, the events where Phenix is pulled apart by tidal forces and loses a substantial amount of mass to Limnus' surface. The reasons for this are hotly debated, with some claiming this is simply the result of material from Phenix becoming buried so deeply within Limnus.
				SrfLandedSeaice = Core samples of the iceberg are weighed against our understanding of the geologic record - due to Limnus' poor heat circulation, some of these icebergs are very old - some in excess of 1000 years old! You're able to gather preserved samples of the precolonial atmosphere, building out the record of Limnus' natural atmospheric properties prior to aeroforming initatives.
				SrfLandedAntistellarcap = Here in the permanent night, you're able to sample the oldest sea ice on Limnus. Analysis indicates the bulk of this water has spent 1.5 billion years trapped within this antistellar cap. But Limnus is a lot older than that - these samples provide further evidence that Limnus used to rotate with respect to Haun.
				
				SrfLandedShores = We know that Limnus hosts shelled animals on its seabeds, and that the food chain down there is likely based around chemosythetic microbes which feed on deep sea vents. How? Because the sand on Limnus' beaches is rich with calcium carbonate, so much that it couldn't possibly occur without the aid of biological activity. Also, sometimes the shells wash up on shore more or less intact. The latter may be a bigger reason for us knowing these things.
				SrfSplashedShores = The water is filled with salt and sand. Analysis of the samples confirm - no microbes to be found. Limnus' biosphere was driven to the bottom of its ocean, and it hasn't been eager to come back up yet.
				SrfSplashed10MYACraters = You feel the need to remind yourself that even though the water is "contaminated by volcanic ash and dissolved gases" that that material actually promotes plant growth a fair bit in Limnus' agricultural regions. Mission control reminds you that if you drink that stuff you WILL get sick though.
			
				SrfLanded10MYACraters = By carbon dating these samples, a definitive link between the equatorial crater chains and the Exilium Extinction 100 million years ago can be drawn. This was already a widely accepted hypothesis, but the confirmation of this model builds confidence in our understanding of Limnus' geologic history and our methods for testing samples.
				SrfLanded2GYACraters = You're able to settle a longfought debate - 2 billion years ago these craters formed and caused the Primoflamma Extinction. Hmm... then what caused the Sirrum Extinction 500 million years later?
				SrfLanded4dot5GYACraterSpecial = You're able to confirm the presence of material lines and compression in the sediment inline with other crater samples - though heavily erroded, these are almost certainly craters as was expected. But it's hard to get a precise date.
				SrfLanded4dot5GYACraters = You're able to confirm the presence of material lines and compression in the sediment inline with other crater samples - though heavily erroded, these are almost certainly craters as was expected. But it's hard to get a precise date
				SrfLandedEjecta = Buried in the ejecta, you're able to find some very small fossilized animals, akin to insects. Carbon dating confirms they lived 100 million years ago, right when they were buried in the debris from the most recent Phenixfall.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				SrfLanded = The goo is a multicellular organism made of individual ameoboid cells which collectively display a range of emergent behaviors. The goo is part of Limnus' deep oceanic ecosystem and is, to the astonishment of xenobiologists, apparently partly thermosynthetic. The goo also appears to be able to perform ATP fixing via an enzyme embedded within its double layered cell memberanes equivalent in function to rusticyanin in the goo's electron transport chain. This protein is of course native to Limnus and is not genetically related to rusticyanin in organisms from Kerbin. Scientists have creatively named the protein "L-Rusticyanin."
				SrfSplashed = Being an aquatic organism, the goo is well here.
				FlyingLow = Flight surgeons carefully monitor the goo's containment vessel for internal damage. Not from any fault in the craft, don't worry! The metabolic properties of goo are well understood, but the misunderstood nature of the goo as a "metal-eater," while inaccurate, contributed well enough to the nerves of the engineering team. The goo seems to be sticking to its provided iron supply however, and has not spontaneously developed the means to metabolize steel.
				FlyingHigh = As Limnus atmosphere thins with increasing altitude, the goo's cytoplasm begins to sputter and boil. The process of this smells terrible.
				InSpaceLow = The goo is very much not loving this environment. The cold unfeeling void of space is certainly cold and unfeeling, much to the dismay of the goo.
				InSpaceHigh = The goo is very much not loving this environment. The cold unfeeling void of space is certainly cold and unfeeling, much to the dismay of the goo.
				
				FlyingLowNearSideOceans = The goo wobbles as the spacecraft banks low over the ocean. Was that a vocalization? Calling for some long forgotten relative? Either way, something is making that goo jiggle!
				SrfSplashedNearSideOceans = The goo attempts to escape, perhaps feeling a calling to some other primordial oozes located deep beneath the waves. Could it be its long lost companions down there?
				SrfSplashedFarSideOceans = The goo seems to have frozen over, and is not making any escape attempts this time. There is no need for a more secure containment vessel, at least not here.
				
				SrfLandedFarSideTerrain = The goo's ability to fix iron begins to slow down as the goo slowly atrophies in the frigid environment. It couldn't be further from the sea.
				SrfLandedGlacialHighlands = The goo's ability to fix iron begins to slow down as the goo slowly atrophies in the frigid environment. It couldn't be further from the sea.
				SrfLandedEjecta = The goo's ability to fix iron begins to slow down as the goo slowly atrophies in the frigid environment. It couldn't be further from the sea.
				SrfLandedVolcanoes = The goo is certainly more active here as the heat from volcanoes causes it to bubble, bubble, toil and trouble...
				
				SrfLanded10MYACraters = The crater environment doesn't appear to meaningfully change the behavior of the goo, it's just as habitable as it would be if the crater wasn't here. I suppose it isn't much for geology?
				SrfLanded2GYACraters = The crater environment doesn't appear to meaningfully change the behavior of the goo, it's just as habitable as it would be if the crater wasn't here. I suppose it isn't much for geology?
				SrfLanded4dot5GYACraterSpecial = The crater environment doesn't appear to meaningfully change the behavior of the goo, it's just as habitable as it would be if the crater wasn't here. Somehow you feel the goo does know it's a crater.
				SrfLanded4dot5GYACraters = The crater environment doesn't appear to meaningfully change the behavior of the goo, it's just as habitable as it would be if the crater wasn't here. Can the goo even... tell if this is a crater?
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				SrfLanded = The material samples, more or less, started out on Limnus, and so they don't change much. The spacesuit material samples confirm they work on Limnus at least.
				SrfLandedVolcanoes = Throw your belongings into a volcano. Throwing belongings into a volcano is for some a very traditional thing to do. For others, feeding the volcanoes is a great way to remember all of the ways that the volcanoes actually feed us by fertilizing the soil.
				
				FlyingHigh = Some of the materials are beginning to glow a faint orange color as they begin to interact with Limnus' ionosphere.
				InSpaceLow = Bubbles which occassionally appear inside of fluid tanks reveal the traces of cosmic particles not detectable from Limnus' surface. There is a bit of an urban legend regarding high energy readings from deep space, and the idea that it could be diffuse stray particles from interstellar warfare, but the idea of such a thing existing is not widely accepted anymore, despite some accounts that such a thing was part of why our colony ship left our original homeworld.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				SrfLanded = Limnus is habitable by Kerbals, but its surface temperature is very low so being outside requires heavy insulation. Well, it's recommended anyway - many claim they are "used to" Limnus' weather and walk around in shorts and tanktops designed only for indoors comfort pretending their teeth aren't chattering.
				SrfLandedNearSideTerrain = For most people, so long being outside is not an explicit part of one's profession, going outside is very rare. Limnus' surface won't kill you, but it's not especially comfortable weather either. Heated buildings both on and buried into Limnus' surface are much nicer for the average Kerbal.
				FlyingLow = Warm air is rushing towards the warmspot in Limnus' ocean, where Haun shines down permanently.
				FlyingHigh = High altitiude temperatures spike hard, Limnus' jetstreams trail back towards the nightside of the planet, carrying warmth with them. However, this air cools before it has a chance to reach the nightside surface.
				InSpaceLow = Space is a land of extremes, Haun's light is very intense without the protective atmosphere, but everything out of sight is brutally cold.
				InSpaceHigh = Space is a land of extremes, Haun's light is very intense without the protective atmosphere, but everything out of sight is brutally cold.
				
				SrfSplashedNearSideOceans = Haun's light shines constantly onto one region of Limnus' nearside ocean, and the entire ocean's thermal gradient reflects that. 
				SrfSplashedFarSideOceans = Some tidally locked planets distribute heat across their equator due to their fast rate of rotation, but Limnus rotates extremely slowly. Water back here recieves barely any heat from oceanic circulation, and even less from the air.
				SrfLandedMountains = Dew which settles onto the device drives a minor recalibration of the instrument. The Haunlight Tundras maintain a cold but still habitable temperature.
				SrfLandedNearsideTundras = Genetic engineering was thought to be a lost art due to the extensive damage of the colony ship, Pass Hopeful, when it crashed here. However farmers quickly reminded the world that selective breeding is effectively the same thing, just slower - and that's why you can eat carrots and other crops that are grown directly out of the frigid soil. Rest in piece to the many ill-adapted vegetables that were not readily able to survive during the early years of Limnusean agriculture.
				
				SrfLandedAntistellarcap = It's painfully cold, you'd need multiple layers of clothing to be even marginally comfortable here.
				FlyingLowAntistellarcap = The air falling down from above is slightly warmer than the air at the ice's surface. That's air which circulated at high altitude from the lit hemisphere finally sinking down into the freezing night.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				SrfLanded = Though the precolonial record is scattered, it is generally accepted that Limnus' atmosphere is thinner than those commonly colonized by Kerbalkind. Some scattered accounts of planets up to and beyond the limits of Kerbal habitability exist, but it's impossible to verify.
				SrfSplashed = The pressure above the water is not that different than the pressures observed on land nearby. Limnus' climateology means evaporation is fairly localized as a phenomenon.
				FlyingLow = The pressure of the air drops quickly with altitude, the challenge of sustained high altitude flight on Limnus is equal parts daunting and exciting.
				FlyingHigh = The data is added into models of Limnus' atmosphere- sparking concerns that returning vehicles from space could be harder than some initially thought. Flight engineers advise you to take time to test and verify that future spacecraft truly have enough parachutes.
				InSpaceHigh = Limnus' exosphere does not extend very far out into space, and the shielding it provides from space radiation can be somewhat lackluster, but a larger atmosphere might've caused the ring material to deorbit faster. People debate the ups and downs at length.
				InSpaceLow = There's no air out here- well, unless you brought some with you? If that was showing up on the instrument, it wouldn't be a good experiment though, would it? The Limnusean exosphere is far too thin to detect.
				
				SrfSplashedNearSideOceans = The subhaunian point is a consistent low pressure zone, which draws in wind from all over Limnus' lit hemisphere. At higher altitudes, thinner air circulates back towards the nightside.
				SrfLandedFarSideTerrain = Higher pressure's in the permanent Limnusean night is the primary reason sighted by residents of this hemisphere regarding the choice to live in the endless night. The higher pressure environment can prevent headaches and health complications in people sensitive to atmospheric conditions.
				SrfLandedGlacialHighlands = Higher pressure's in the permanent Limnusean night is the primary reason sighted by residents of this hemisphere regarding the choice to live in the endless night. The higher pressure environment can prevent headaches and health complications in people sensitive to atmospheric conditions.
				SrfLandedAntistellarcap = This high pressure zone is where high altitude currents from Limnus' lit hemisphere cool and settle. It can take a fair amount of time for the air to circulate back to the dayside. This high pressure environment keeps the dark sky clear of clouds, a boon for astronomers who employ observatories mounted on icebreaking ships.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				InSpaceLow = The magnetic field is tilted off the rotational pole of Limnus by 15 degrees. Geomagnetists back home are excited, as they believe the rotation of Limnus' core may serve as a record of an era where Limnus spun on its axis, instead of being tidally locked. Based on the residual rotation rate of Limnus' internal dynamo, it's estimated Limnus became locked with Haun approximately 1.5 billion years ago. This is a major new clue into the prehistory of our homeworld, but these measurements are based on Limnus' magnetotail being weaker than was previously estimated. Friction between the core and Limnus' outer layers is slowing its internal dynamo down faster than expected. Just another way in which Limnus truly is on its last legs as a life-harboring world.
				InSpaceHigh = While it is believed that Limnus became tidally locked around the time of Siccum Extinction, which wiped out an early generation of multicellular marine life, there is a conflict in the models. it is believed that Limnus rotated three times every two revolutions around Haun, still incredibly slowly (and technically still a form of tidal locking), but either way that involves a very specific rate of rotation, and we see a very specific observable "drag" on the inner core's rotation today. To make these pieces of data into one whole, a radical new idea emerges - Limnus had to have formed, and become tidally locked to Haun very quickly after its formation, and *then* begin a period of spin-orbit resonance about 500 million years afterwards. This model fits the data, but *how* Limnus locks and unlocks can not be gleamed from magnetic field data alone.
			}
		}
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[devCommentary]]:FOR[MagDes] // Developer Commentary
{
	@RESULTS
	{
		Body
		{
			name = Limnus
			Values
			{
				SrfSplashed = Wolf - "After some reflection regarding the project, I eventually came to terms with the fact that a major region MagDes had failed to materialize was because the scope of the project was beyond what I myself could accomplish. This led to me reaching out to Luna of Whirligig World fame, a friend and creative inspiration of mine, to help make this pack properly. Later on, I understood that writing was a similarly daunting task to tackle on my own, leading me to reach out to Nik, the creator of Proxima: A Human Exploration of Mars, and other projects, who is also a close friend and inspiration of mine. Nik has been helping to carry the load of writing all of these science definitions, and we're having a lot of fun doing them. In both cases I've had to accept some additional creative input beyond my own existing in this pack - but in hindsight I don't know why I ever saw that as a downside."
				SrfLanded = Wolf - "Welcome to Magnificent Desolation! This planet pack has been a little labor of love for a very long time, and while the development on this specific iteration of the project started in October of 2026, its ideas, concepts, and themes have been built out over many, many years all the way back to 2021. In rebooting the pack with the assistance of my friend Luna, (aka Whirligig Girl), she asked if I had any specific ideas for new parts that could be added as bonus features in the pack. Whirligig World, a major inspiration for MagDes, features its own exclusive parts which spoof off Mesbin's unique shape, but seeing as Limnus is a more typical planet I preferred a concept with some kind of new gameplay functionality. The disk you're playing around with is that part! The developer commentary will contain some spoilers and fourth wall breaking, you've been warned! Have fun, and after five plus years in development, hopefully it was worth the wait."
				FlyingLow = Wolf - "Science definitions are an often time neglected element of KSP planet modding, added to fill a feature set rather than to tell a story. This is by no means always the case, and some packs use them to great effect! But Kerbal Space Program is not Outer Wilds, and despite some early ideas and musings about story lines, the method of 'throw walls of text at the player while they're trying to fly' does not always capture players. More often than not I find myself forgetting the experiments can even have unique text when playing the game. Despite this, I did want to at least try my best to fill out the science definitions for Magnificient Desolation, if only to get some of the stories I have in mind about this setting and the planets within them out of my head and into the world. I figure if at least one other person decides to take their time and read through these messages and they find themselves captivated by concepts we try to explore, that this was all worth it. There is a full timeline of Limnus I drafted out to write science definitions from, I wonder if anyone could recreate it based on only in-game text?"
				InSpaceLow = Wolf - "One of the hardest aspects of this mod to get right was Limnus' moon system. Limnus was always intended to have a small family of asteroid moons orbiting it, and this was especially true after the story of Limnus became fleshed out. However, making the set up of several similarly small asteroid moons feel *interesting* instead of *repetitive* was a challenge. If Limnus has too few moons, it doesn't quite capture the original vision or dramatic story that Limnus is meant to tell. If Limnus has too many moons, playtesters often became very distracted by them, and sometimes even frustrated out of an unspoken 'obligation' to land on each one. In the current version of the pack we treat Pheber and Phenix as the only "important" moons with meaningful science rewards and biome maps, while the three small inner moons are used as "biomes" of the ring system, collectively almost acting as one third moon, while being independently less emphasized. I think this set up balances the needs of the Limnus System well, and (ironically) I was overjoyed to watch some early playtesters 'skip' visiting the little moons to focus on seeing the big ones." 
				InSpaceHigh = Wolf - "I wanted Limnus' continents to eventually become burned into the player's brain, much like Earth's, by having very recognizable shapes that could be memorized - in some ways having Limnus be locked helps make that easier. There's a side of the planet you'll always see on the way out and in depending on if you're going to the planets beyond or within Limnus' orbit. When I repainted Limnus' terrain for the shortlived 2023 reboot of MagDes, I tried to focus on making the coastlines not only very rough, but also on having very distinctive shapes. "After the continents were blocked out, I slowly went along each coastline adding an additional pass of shaping to ensure there were no large straight-edged coastlines, and only after those coastlines were finished did I begin to work on the actual terrain of the mountains, volcanoes, and crater bowls. I tried to evoke real shapes that Earth's coastlines have, while trying to make sure it's not *too* much like Earth. I think I got pretty close to the vision I had for this planet."
				SrfLandedFarSideTerrain = Wolf - "A tidally locked planet was a setting that I really wanted to explore. Not only because many depictions of 'eyeball planet' artifically show terrain sculpted to align with thermal gradients, and I wanted to try my own way, but because our solar system only narrowly escapes having one itself. Both Mercury and Venus could've been tidally locked planets had things turned out different. I loved to imagine the curious minds of Limnus' early days making dangerous treks into the dark endless night in order to perform astronomical observations of the stars and planets of the system they now found themselves in."
				Antistellarcap = Wolf - "Both in and out of in-universe canon, this icesheet is one of the oldest features on Limnus. I first painted this weird network of buckling ice back when Limnus was made for the first time, back in 2021. Limnus has remained a tidally locked planet all this time, so when the rest of the planet was being repainted, I decided to reuse the existing asset of the icesheet both to save time and also as a fun little nod to the mod's early history."
				SrfLanded10MYACraters = Wolf - "When Limnus was first created it was a fairly 'generic' planet inspired loosely by one I had found in Space Engine. Limnus was always a tidally locked planet, but the in-universe story of Limnus and Phenix (inspired by real models of Mars and Phobos) did not exist until a development restart in 2023. At that time, there was some doubt over whether or not Limnus would even remain the 'intended' default homeworld, but once this concept was created Limnus finally broke through a creative barrier to become not just a necessary starting place for the player, but a world I was very excited to explore and flesh out in detail." 
				
				SrfLandedNearSideTerrain = "Nik - Learning how to write about a world that doesn't exist has certainly been one of the more fun challenges of contributing to this modpack, but its one that I enjoy a lot and I'm learning a lot about. Wolf and I have collaborated on some cool stuff before but its so awesome to see the scale of everything here!"
				
			}
		}
	}
}
