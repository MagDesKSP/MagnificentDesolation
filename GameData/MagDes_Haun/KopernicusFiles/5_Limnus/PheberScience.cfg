//Pheber is the second largest moon of Limnus, though that... isn't saying much. It formed alongside the others, 100 MYA ago, and its heavily cratered appearance is owed to the Beric Bombardment which occured in the last 100 million years, 
//because in the outer Haun System? 
//the girls are fiiiiiiiiightinggg
//Pheber is not one for conversation, and is largely just "part of Phenix that isn't part of Phenix yet." 
// Pheber's distinctive Goner Bowl (MajorWollop), which nearly shattered the little gal, was formed by a long-period comet thrown in during the Beric Bomardment that was already on its way in from Haun. 
// With the kintetic energy the comet had, it's considered more likely the object was partially disrupted by Haun, instead of being a fresh comet.

//Pher has 3 biomes:
				//Surface
				//Craters
				//MajorWollop
				
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				InSpaceHigh = Limnus still fills the windows whenever it's in view, but so too does Pheber. There's a passing comment about the associations made by the blue-red bichromatic lighting made, but it goes over your head.
				
				InSpaceLowSurface = While it is the second largest satellite of Limnus, your training has made you very aware that it is not actually an especially large object so far as planetary bodies are concerned. That doesn't matter now though, even Pheber seems mighty as you approach it, and Limnus all the more magnificent in comparison. The rings are distant already, making a thin cut out of the ink-dark sky.
				InSpaceLowCraters = From the window you count the craters on Pheber's surface, you even tally them up by size. You furrow your brow, how could so many large, violent impacts exist on a world that's only 100 million years old? It was very clear that age was widely accepted for Pheber in the mission briefing...
				InSpaceLowMajorWollop = To celebrate your successful voyage to Pheber, you read an exert from the Fourth Book of Redefinitionism: "And so it was two weeks later that the second hearld of the great beast from the sea would make its way to the lighthouse of Limnus. A meek and scaly creature, with bulging eyes across its head where one would expect hair. It introduced itself as Pheber the Feable, a servant of the Great Fire Bird. Once again Limnus calmly received the warnings of the messenger, as she had with Phenom before. 'A thousand years ago Phenix nested on the island you call home, and it cares little for what you have brought to it. A thousand years beyond today it will care little for what lives there then, and a thousand years beyond that and a thousand years beyond even that!' Limnus was patient but unphased, she knew the actions she was taking, and believed that because she had helped so many others, fate would help her in turn. She thanked the creature for its time and its words, and again watched as the strange visitor turned heel and receded into the water."
				
				SurfaceLandedSurface = You begin to consume a delightful corned beef sandwich as you verify the health of the spacecraft. They told you Pheber had the second strongest surface gravity of the moons of Limnus, and that sounded impressive at the time. Various loose articles within the vehicle, such as some pens, a small notebook, and crumbs of bread, very slowly drift towards the ground as the craft settles. You're realizing how truly unimpressive a ranked statistic can actually be depending on context.
				SurfaceLandedCraters = A little targeted research never hurt anybody. The surface below the craft feels nice and firm, perhaps the dust is not as deep within Pheber's crater bowls. The rusty red terrain outside bathes the cabin in a strange light, like a permanent sunset - well, every sunset on Limnus is permanent so to your mind that's a bit of a redundant statement.
				SurfaceLandedMajorWollop = From down here, only the stars of the galaxy are visible here. For a moment, you sit back in the cockpit, and ponder the peacefulness of the situation.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				InSpaceHigh = It's weird to see the continents on Limnus from this altitude because they just look exactly as they should. You've seen maps of the world all your life, in school, in your career, as idle pieces of iconography. It's one of those ambient elements of life you've never regarded, those shapes because unconciously memorized. Of course they should look like that, that's what they look like, we know this, why wouldn't they? But seeing it, Limnus as it is from this altitude... it's somehow surreal. 
				InSpaceLow = Detailed observations of Pheber's three dimensional shape are valuable, as it's hard to determine the exact shape from Limnus alone, even across multiple latitudes. A distinct region of "bite marks" on Pheber's farside is notable, as it decreases the overall estimate of Pheber's volume, and thus increases the esimates for Pheber's density. Pheber still has a relatively low density, but the estimates finally agree with the reality that Pheber is in fact dense enough to exist without being pulled apart by Limnus' tides.
				
				SurfaceLandedSurface = Your brain has a persistent sensation that the surface of Pheber is on the verge of falling out from under you, and you take care to double check your attachment to the surface. Moving along the surface is no walk in the park, it's more like a spacewalk across the surface of a spacecraft.
				SurfaceLandedCraters = The slopes of the crater show signs of collapse with streaks of rubble arranged pointing down towards the crater bowl. It's likely that these collapse features are the result of volatile sublimation or perhaps Pheberquakes. The environment of this bowl seems to you like a.... beautiful desert. No, no that's not quite it... maybe it'll come to you later.
				SurfaceLandedMajorWollop = The steep cliffs that form the walls of this crater feel as though they extend impossibly far into the void, and Limnus' disk crests over the rim to flood the basin in a blue light. The violence of what happened here is shrouded under layers of dust.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				SurfaceLandedSurface = Pheber's composition closely reflects that of the smaller moons and rings of Limnus, largely compromised of silicate minerals with occasional flecks of heavier metals. Magnesium-rich rocks from Pheber's surface, including what appears to be olivine, indicate that some of the rubble that forms Pheber originally existed in an environment of intense heat and pressure, not unlike a planetary interior. However, the isotopic ratios are inconsistent with those of Limnus, as if Pheber's material came from somewhere else.
				SurfaceLandedCraters = The crater bowls of Pheber seem to have volatile deposits not far below the surface, Pheber is by all means primarily rocky material, but the abundance of ice is notable. It's unlikely this ice was here when Pheber formed as Haun's heating would boil it out of any collapsing debris disk, and given its concentration within the impact basins it's incredibly likely it was delivered by impacts following Pheber's reaccumulation. Pheber is not only heavily cratered, but a lot of outer solar system impactors travelled a long way to get here all within a short time span. Samples from Pheber form the scientific basis of a newly identified event in the recent history of the Haun System: "The Beric Bombardment."
				SurfaceLandedMajorWollop = Heavy pitting within the samples collected from this region suggest it had more volatile deposits than the rest of Pheber. It's likely these are the ghosts of the cometary impactor which formed the Goner Bowl, places where icy remains have boiled off into space. Detailed analysis of the of compression of the crater bowl and extent of pitting yields a probable age for this crater of around 87 million years, within the age range of all the craters on Pheber. Yet another point in favor of Limnus' moons being only 100 million years old! The scale of the impact also implies that the comet was nearly forceful enough to destroy Pheber entirely. Scientists modeling the impact find a preference for an object that had already passed closely by Haun, becoming disrupted, and already heading back outwards before it was intercepted by Pheber's surface.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				InSpaceHigh = As the goo's body fails, it almost seems to be turning red to match Pheber! It's actually just reflecting the light of Pheber... not that Pheber being red would be groundbreaking information. The goo does not collect any meaningful amount of dust, Pheber seems to keep its orbit very clear of ring debris.
				InSpaceLow = As the goo's body fails, it almost seems to be turning red to match Pheber! It's actually just reflecting the light of Pheber... not that Pheber being red would be groundbreaking information. The goo does not collect any meaningful amount of dust, Pheber seems to keep its orbit very clear of ring debris.
				SurfaceLanded = The mystery goo's fleeting attempts to metabolise the miniscule iron content of Phebish regolith is slowed by the isotopic ratios of Pheber's iron differing from that found on Limnus. Does iron on Pheber not share an origin with iron on Limnus? Post mortum analysis of the samples removed from the goo's body at least confirm that Pheber's material content is consistent with the rings and small moonlets of Limnus.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				InSpaceHigh = Light reflecting off Pheber is increasing the thermal environment slightly...
				InSpaceLow = Pheber is larger and brighter than the shepards of Limnus' rings, so the thermal environment is actually pretty toasty, but still cooler than low orbit around Limnus. Water and clouds do tend to reflect more light than solid rock.
				InSpaceLowMajorWollop = There is some idly musing from the planetary scientists about the geometry of Pheber's Goner Bowl being able to concentrate Haunlight into a single, destructive keyhole capable of melting a spacecraft. The scientists obviously mean it in jest, Pheber is reflective but nowhere near enough for that to be possible, but the engineers nearby nervously monitor the temperature readings as the craft passes over the crater...
				
				SurfaceLandedSurface = Pheber recieves less heat from Limnus than the moons inwards of it, of course Haun is just as hot as it is anywhere in the Limnus System. However, the reduced reflected energy from Limnus might allow volatile materials to exist within shadowed regions on Pheber's surface. Unlike the inner moons, ISRU may be possible on Pheber.
				SurfaceLandedCraters = The steep walls cast shadows across the crater bowl, and the increased time in shade brings the average temperature down. The deep crater bowls of Pheber are cold enough they may more readily host water ice, perhaps enabling ISRU in the future.
				SurfaceLandedMajorWollop = Despite being such a deep scar on the satellite's leading hemisphere, the interior of the Goner Bowl appears to be warmer than other parts of Pheber. This is due in part to the equatorial position of the crater, reflections of Haun's light from the crater walls into the crater's bowl, and the low walls allowing Haunlight into the region for more of Pheber's day.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				SurfaceLanded = Pheber's surface does not experience any atmospheric pressure. However, the reddish color is from materials on the surface oxidizing as particles from Limnus' exosphere make their way to Pheber. The innermoons are oxidized far heavier, so they take on even darker colorations.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				SurfaceLanded = Pheber shows fairly constant seismic activity as it shakes at the might of Limnus, but the spikes whenever Phenix passes nearby are much stronger. Because Pheber's orientation is locked with respect to Limnus, the direction of tidal stress is consistent. Phenix meanwhile moves freely around Pheber, and the distance between the two moons changes as they proceed in their orbits. This puts strain on Pheber's structure from all directions, and it seems that if Pheber was much closer to Phenix, it's likely the larger satellite would be strong enough to send Pheber into a state of chaotic rotation...
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				InSpaceHigh = Limnus' magnetic field passes through Pheber in ways that are difficult to predict, confirming Pheber is not internally differentiated, and is just a rubble pile on a much larger scale than Otempta and Trendle. The official planetary science term is of course that Pheber is tossed like a salad. 
				InSpaceLow = Pheber appears to have some weak localized magnetic loops eminating from two regions under its surface. Perhaps large metallic units, similar to Phenom, are buried deep within it, and have collected some magnetic charge from Limnus. These fields are incredibly weak, and do not pose a risk to spacecraft. 
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				InSpaceHigh = Broad scale observations of the gravitational interactions between Limnus and Pheber are in complete conflict with formation models that involve Pheber and the other moons being older than 100 million years old. While this belief is already outdated, every new piece of data just leaves the old model further buried under rigorous scientific process.
				InSpaceLow = As the detector passes over Pheber's surface, it becomes apparent that Pheber's crust is heavily compressed within the impact bowls. The compression implies the impacts were incredibly energetic and the kinetic energy required implied suggests the majority of the impacts Pheber experienced were from objects that fell in from the distant icy reaches of the Haun System - comets. Why have so many comets fallen towards the Inner Haun System in the last 100 million years?
				
				SurfaceLanded = Gravitational models of Pheber's orbital decay produce a shocking result - the distance between Pheber and Limnus is shrinking slower than the distance between Pheber and Phenix! It appears Pheber will collide with its larger sister in less than 500 million years. We're lucky to get to observe Pheber, but it's hard not to admit that eventual collision will look very cool from Limnus. 
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[infraredAstronomy]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				InSpaceHigh = The thermal environment isn't perfect, but with some clever timing you're able to conduct some decent observations of the Outer Haun System. Egress and Vaylute both have additional rings that are detectable in infrared wavelengths, and too thin to be seen in ground based telescopes. 
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[devCommentary]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Pheber
			Values
			{
				InSpaceHigh = Wolf - "Pheber and Phenix form an obvious and very cute pneumonic series, and eventually Phenom was named to follow the series later- Phenom joined the mod in 2023, but it wasn't until 2026 that a playtester forced me to confront the fact that despite the similar spelling the "Phe-" in Pheber and the "Phe-" in Phenom are pronounced differently. (Pheber pronounced like Feeber, and Phenom pronounced like Fehnom). This is really funny to me specificially."
				InSpaceLow = Wolf - "During the early phases of MagDes's re-reboot, Luna and I had a very brief back and forth over the logistics of the word "moon" in systems where there is no The Moon from Real Life. This is especially funny in the KSP-version of this setting, because The Mun exists instead, but Kerbals still use moon as a generic term in the base game. We eventually concluded that it would best to not overthink it and just roll with the generic term moon. I proceeded to try my absolute hardest to never ever use the word moon in MagDes as a personal challenge, and frequently reskimmed the mod to trim mentions of "moons" or things being "moons" out of the pack's writing. Developer commentary doesn't count because we both live on Real Earth in Real The Moon world. Did you notice? Using the word "satellite" actually sounds surprisingly natural!"
	
				SurfaceLanded = Wolf - "Pheber was one of the first objects I made for MagDes, all the way back in 2021. The shape was more or less the same as it is today, just executed poorly. The exciting thing is that Pheber had a horrifying bug which caused its terrain to unfold, with each PQS quad turning 90 degrees. It looked like a pinecone opening up. I shudder."
				SurfaceLandedMajorWollop = Wolf - "During early development phases, Pheber was actually moved out of orbit of Limnus entirely and became a Limnus coorbital in the leading lagrange point. The idea being that Pheber *was* a moon of Limnus, but the impact that formed the Goner Bowl (which did exist and already had this name) knocked it out of orbit. But to be honest I was 17 years old and Pheber was very broken, I just wanted to make it harder to realize how broken Pheber was."
			}
		}
	}
}