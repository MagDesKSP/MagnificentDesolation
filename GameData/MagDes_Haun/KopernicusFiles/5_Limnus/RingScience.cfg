//The Small Moonlets of Limnus - Phenom, Otempta, Trendle, are all the "biomes" of Limnus' ring system.


@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = The shadows outside the cabin are moving, but the computers say you're holding still. Being born on a planet where shadows are near-constant features... you feel your stomach growing sour.
				InSpaceLow = There's some old story about a hanging sword and the looming danger it presents at all time. You don't remember the name, but part of you wonders why Phenom was not named for it. Phenom was instead named for the "Herald of Phenix" because of the way it seems to "lead" the other moons through the sky, which is also pretty cool.
				InSpaceHigh = It didn't take long to get here, just a little careful planning is all. If you can do this, then you feel ready for eventual missions to intercept or even dock to prepositioned artificial targets in Limnus orbit.
			}
			name = Otempta
			Values
			{
				SrfLanded = Now that you're on the surface, some of those boulders outside are as large, if not larger, than your entire ship. You feel like this should worry you but it's not like they're going to jump out and scare you.
				InSpaceLow = In Otempta's proximity, things have clamed down, much less dust and ring grain to worry about. The dust that has settled on the window sparkles almost like little beads of rain in the morning sun as Otempta's bizzare silhouette hangs there before you.
				InSpaceHigh = Mission control has not stopped asking you for updates on how often you are experiencing MMOD (Micrometeoroids and Orbital Debris) strikes. You roll your eyes and report that everything is fine right in time for a large sharp "tink" to sound out in the cabin and be detected by the microphone. Aside from a small scare you're absolutely fine, but now mission control is even more excited and nervous. It's going to take ages to calm them down...
			}
			name = Trendle
			Values
			{
				SrfLanded = The dramatic shapes of Trendle can make it look and seem like a far larger or smaller object than it actually is. The miniscule gravity you experience makes you wonder if you're truly settled on the surface at all.
				InSpaceLow = Trendle has a complex shape, but beyond one pronounced impact basin on the outerlobe, you can't make out any smaller craters. It's possible that Trendle's surface is generally not rigid enough to preserve such features. It's probably sheer luck that crater bowl hasn't collapsed.
				InSpaceHigh = From this altitude, Limnus is beginning to break your brain. You feel less and less that it is "terrain far below you" and more and more that it is "an object in the sky." Granted, it's still very large from here, but your eyes can juuust about see the full disk at once.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = You dig your boots into the dust and find very little friction. You're practically weightless, even now. The sky is moving. You stare at the ground to combat your growing nausea.
				InSpaceLow = Floating alongside Phenom, the lifeless rock that it is, with Limnus looming behind...  fills you with a sense of... it's like... a splendid nothingness. 
				InSpaceHigh = You feel, a strange sense of... eerie sympathy for Phenom as you see it float above the cloudtops with you. It's as if, in equal parts, neither of you are really supposed to be here above Limnus. And yet you are.
			}
			name = Otempta
			Values
			{
				SrfLanded = Watching the rings arch across both sides of the sky, Haun's light beating down as the world looks on, you're filled with a feeling of... some kind of beautiful bleakness.
				InSpaceLow = You're nervous about the idea of a spacecraft touching down among the jagged rocks of this tiny world, and evenmoreso in regards to your fragile spacesuit!
				InSpaceHigh = You look down at Otempta and you squint, it's like a wild moasic of spare parts! You correct your wording quickly, but it's too late, for decades there will be conspiracies about Otempta being a cobbled together spaceship...
			}
			name = Trendle
			Values
			{
				SrfLanded = Trendle's lobes loom large above you, and you hope that everything is securely attached. Regolith clings to you in this strange, weightless place.
				InSpaceLow = As you pass over the lobes and central "neck" of Trendle you can't help but feel like you're too close for comfort - you call mission control: "we're not going to crash, right?"
				InSpaceHigh = Watching Trendle's two lobes, joined so delicately as they float high above Limnus, you're filled with an... awesome forlornness. How many moons like this came before Trendle and the rest?
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = You take out a chisel and begin to carefully remove a cut of Phenom. You groan, it's actually rather hard to do. Once you manage to remove this piece, you turn it over and are shocked to find a very smooth shiny appearance- it's metallic, very metallic. The sample is entirely iron and magnesium, could it be that Phenom is not a piece of Phenix, but an ancient piece of Limnus' upper mantle kicked up from the last Phenixfall...? Or is Phenix more metallic than originally thought? The answer may lie further out. For now, you can at least say Phenom won't make a good gas station.
			}
			name = Otempta
			Values
			{
				SrfLanded = Otempta's rubbly surface makes the removal of valuable samples easy - too easy, mission control tells you to pick your favorite rocks because if you take too many it's going to throw off your weight calculations. Otempta is an absolutely rubbly rocky object and it's entirely depleated of volatiles! You're not going to have much luck extracting resources here.
			}
			name = Trendle
			Values
			{
				SrfLanded = Trendle is mostly just gravel, and rather fine chunks too. You gather up a modest sample of rocks, silicate minerals align roughly with the composition of the rest of the rings and even Otempta, implying a not-unexpected shared origin. Some of the rocks closer to the neck are slightly reddened, appearing oxidized.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = The Goo wiggles and flops about in its canister, barely affected by the miniscule gravity here. Dust and debris accumulates within the membrane of the Goo, unintentionally it may provide a worthwhile sample. Picking it out of the corpse goo might not be fun though...
				InSpace = The Goo is tired of your carelessness! It decides to die ESPECIALLY quickly when you expose it to the vacuum of space this time.
			}
			name = Otempta
			Values
			{
				SrfLanded = The Goo wiggles and flops about in its canister, barely affected by the miniscule gravity here. Dust and debris accumulates within the membrane of the Goo, unintentionally it may provide a worthwhile sample. Picking it out of the corpse goo might not be fun though...
				InSpace = The Goo cares little for your space adventure! It decides to boil ESPECIALLY quickly this time when you expose it once more to the expanse of space.
			}
			name = Trendle
			Values
			{
				SrfLanded = We can't tell if it's some sort of response to the gravitational field of Trendle or what, but the goo assumes a bilobate shape similar to Trendle itself. Let's chalk this up to a coincidence. Also it dies. As expected. It was clearly not an active decision to become that shape. It's dead.
				InSpace = The Goo knows what's coming, and it's entirely apathetic. The goo simply allows the solar wind, the freezing void, and everything else claim it silently. The science team tells you to stop projecting your feelings onto the goo - or at minimum keep those thoughts to yourself.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = Dust from the little satellite's surface seems to get stuck to some of the metallic samples upon exposure, but not much.
				InSpace = The material samples don't seem to acknowledge the presence of the small satellite.
			}
			name = Otempta
			Values
			{
				SrfLanded = Dust from the little satellite's surface seems to get stuck to some of the metallic samples upon exposure. A fair layer of dust builds up, a few extra miligrams of samples for home!
				InSpace = A micrometerorite strikes the open container! Seems like you've managed to capture a ring sample which has embedded itself into a particularly adhesive sample.
			}
			name = Trendle
			Values
			{
				SrfLanded = Dust from the little satellite's surface seems to get stuck to some of the metallic samples upon exposure. A fair layer of dust builds up, a few extra miligrams of samples for home!
				InSpace = The material samples don't seem to acknowledge the presence of the small satellite.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = Phenom's surface bakes in both the light of Haun and, well also the light of Haun, but it's the reflected light of Haun you see.
				InSpace = A substantial amount of heat reflected by Limnus' oceans and cloudtops falls onto Phenom.
			}
			name = Otempta
			Values
			{
				SrfLanded = Uneven heating on Otempta likely contributes to its rubbly apperance, with heat expansion and contraction breaking up the rubble on Otempta into smaller chunks.
				InSpace = The dark, sooty rings of Limnus reflect barely any thermal energy, but the material does absorbs and trap a fair amount of heat. Overall however, Limnus' rings are too thin to meaningfully change the thermal environment of Otempta. 
			}
			name = Trendle
			Values
			{
				SrfLanded = Trendle's surface seems to vary in temperature widely due to its highly irregular shape casting long shadows across its lobes. The neck seems to be the coolest on average, aligning with a strange reddish color on its terrain.
				InSpace = Thermal signatures from Limnus are decreasing, but reflected energy from Trendle itself faintly warms the spacecraft as the little asteroid cools and rotates.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = Limnus' exosphere is slowly dragging Phenom inwards, though it's hard to meaningfully detect the pressurewave the little moon is sending through the exosphere, being on the surface makes this nearly impossible infact.
				InSpace = Limnus' exosphere is slowly dragging Phenom inwards, though it's hard to meaningfully detect the pressurewave the little moon is sending through the exosphere.
			}
			name = Otempta
			Values
			{
				SrfLanded = There is no desernable atmosphere to find out here... Limnus' exosphere only stretches so far before it's undetectable.
				InSpaceHigh = For a moment the barometer spikes. There is some concern the instrument has malfunction, but those fears are somewhat-relieved when the team realizes it's actually a micrometeorite hit on the instrument. Hopefully it still works?
				InSpaceLow = Oh thank the old gods... it's still working it, says 0 kPa which is not a useful or unexpected result but, gosh this was still expensive to send out here.
			}
			name = Trendle
			Values
			{
				SrfLanded = It's purely tides pulling the rings and the satellites within down towards Limnus. Not even an accidental hit on the barometer.
				InSpace = It's purely tides pulling the rings and the satellites within down towards Limnus. Not even an accidental hit on the barometer.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = Phenom's porosity is very low, but occasionally something deep within it "pops" and registers as a tremor. Limnus' gravity is trying it best to tear this thing apart, its metallic composition is the only reason it's made it this far.
			}
			name = Otempta
			Values
			{
				SrfLanded = You get fairly frequent hits on the seismometer, but this sparks a debate over whether it's truly seismic activity or actually impacting ring material. This leads for a five hour breakout session among the geology team, who decide the latter is the more likely source.
			}
			name = Trendle
			Values
			{
				SrfLanded = It's very quiet on Trendle, any shifts within it register only softly on the detector.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				InSpaceLow = Limnus' magnetic field seems to bend around Phenix slightly, but the field lines pass though Phenix as though it is one solid chunk of material with little if any internal voids.
				InSpaceHigh = Limnus' magnetic field seems to bend around Phenix slightly, but the field lines pass though Phenix as though it is one solid chunk of material with little if any internal voids.
			}
			name = Otempta
			Values
			{
				InSpaceLow = Magnetic field lines pass through Otempta with incredible inconsistencies which imply a substantial amount of empty space inside the small satellite.
				InSpaceHigh = Magnetic field lines pass through Otempta with incredible inconsistencies which imply a substantial amount of empty space inside the small satellite.
			}
			name = Trendle
			Values
			{
				InSpaceLow = Trendle's internal structure seems to be somewhat porous as indicated by the way Limnus' magnetic field bends through its interior.
				InSpaceHigh = Trendle's internal structure seems to be somewhat porous as indicated by the way Limnus' magnetic field bends through its interior.
			}
		}
	}
}

//Developer Commentary
@EXPERIMENT_DEFINITION:HAS[#id[devCommentary]]:FOR[MagDes]
{
	@RESULTS
	{
		Body
		{
			name = Phenom
			Values
			{
				SrfLanded = Wolf - "Phenom was a later addition to the Limnus System, it's a sort of representation of 'the next rock to fall' that came about during the 2023 development restart. I believe even at the time it was Luna who suggested I add such a moon, and I quite like having it. It very much sells the idea that, even the most hospitable places in this remote star system are only that way for a beautiful fleeting moment. It calls the mind the fragility of our own planet, we're quite lucky we don't have anything like Phenom to worry about... well, not exactly anyway."
				InSpaceLow = Wolf - "See this view? There are many moments where a new feature in MagDes hammered in my belief that this pack was worth making, and this was one of them. A playtester remarked the other day that it was like 'visiting the asteroid that killed the dinosaurs.' What a wonderful thing that is, what a wonderful what if! Phenom is, in many ways, very similar to a moon called Statmun in Luna's Whirligig World, including the puzzle of trying to land on it. I think Statmun is far prettier, but I didn't want the tiny moons to be too distracting."
				InSpaceHigh = Wolf - "Phenom was the fifth moon of Limnus to be added, but it was only the third to share the Phe- suffix. I decided that because it is so close and large in the sky, it deserved a name that put it more in line with Pheber and Phenix rather than the other smaller moons."
			}
			name = Otempta
			Values
			{
				SrfLanded = Wolf - "Limnus' original three moons included Pheber and Trendle, but also a third moon called Findoe. Findoe did not make it into this iteration of the pack. Findoe was a silly little moon, a tiny asteroid with a singular lunar-style mare on its nearside. This visual was very funny and quite distinctive, but didn't really fit the new art style of the pack. Findoe also had a tenious ring of dust, which was again very amusing, but not quite right for the pack. Otempta effectively replaces Findoe, being a small middle moon surrounded by rings (granted, the rings of Limnus instead of its own rings). I still miss Findoe, but Otempta is quickly growing on me."
				InSpaceLow = Wolf - "Ever since the real life OSIRIS-REx and Hayabusa2 spacecraft arrived at asteroids Bennu and Ryugu respectively, I've always wanted to replicate that "spinning top" shaped rubble pile look in Kerbal Space Program. This goes all the way back to Minor Planets Expansion where I have a similarly shaped moon around my Haumea stand-in, (though it is much less impressive looking). A new technique in heightmap generation allowed me to directly sculpt the shape of Otempta using blender. The results speak for themself!"
				InSpaceHigh = Wolf - "When you have a ring system, you gotta have a shepard moon. Sometimes it feels like a trope at this rate for planet packs to embed at least one moon in every ring system, the KSP2 Redux team even added one such moon to Dres. But you know what? It's a trope for a reason! It's good, it's realistic, and above all else, it's fun! And the 'exceptional small' single-biome bodies idea allows this to not feel like bloating the object count too."
			}
			name = Trendle
			Values
			{
				SrfLanded = Wolf - "Trendle's name comes from (very loosely) the planet Trenzalore from Doctor Who canon. Trenzalore is a very important world in that TV Show's story, so why is such an unassuming moon named after it? Well in the original version of the mod, Trendle was where you'd find a massive chunk of the original colony ship that delivered Kerbalkind to Limnus. It was going to be a massive crashsite on the farside of Trendle - I tried to demonstrate that by making one of the stock UFO easter eggs spawn on Trendle, and I couldn't figure it out. So I gave up! The name got to stick around though, I mean you can't beat that name! *Trendle!* It's a fun name!"
				InSpaceLow = Wolf - "Trendle wore many hats over this mod's long history. Originally it was the rather boring outermost moon of Limnus, it was one of three effectively identical asteroids gameplay-wise, distinguished only by being kinda football-shaped. Later on it evolved into a distant, retrograde, captured asteroid. And then later still I turned into into a rubble pile with a small submoonlet inspired by Dinkinesh and Selam, and then when that iteration of the mod was cancelled Trendle and its companion Tucker were donated to Whirligig World. Now Trendle is kind of all of its history in one object: it's an elongated, outermost-of-three, contact binary asteroid. It even has a big crater on it! Why the crater is important? Well land and read the disk again, I'll tell you."
				InSpaceHigh = Wolf - "When I found out that modeling asteroids in blender was possible, there was simply no world in which I did not make one of these moons a contact binary. It feels like everywhere we look with space probes right now, these asteroids keep turning up as doubles! Trendle was at one point a proper separated binary asteroid, and its little companion was named Tucker. While I decided against giving Trendle or other very small objects distinct biomes in this mod, feel free to call one of Trendle's nodes Tucker in honor of one of the two forgotten moons of Limnus."
			}
		}
	}
}