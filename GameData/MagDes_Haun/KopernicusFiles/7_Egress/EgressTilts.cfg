@Kopernicus:FOR[zMagDes]:NEEDS[TiltEm] //TiltEm Support
{
    // Declination = 90 degrees - Inclination
	// Right Ascension = Longitude of Ascending Node - 90 degrees
	 
	// Inclination = 90 degrees - Declination
	// Longitude of Ascending Node = Right Ascension + 90 degrees
	@Body[Egress]
    {
        @Properties
        {
            // The legacy pair loses to poleRA/poleDec wherever a body has both,
            // so any pole already written for this body has to go first.
            !poleRA = delete
            !poleDec = delete
            %tiltx = -13.159504
            %tiltz = 16.520645
            %initialRotation = 219.427147
        }
    }
}