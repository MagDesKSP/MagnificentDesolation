ParallaxTerrain
{
	
	Body
    {
        name = Phenix
        emissive = false
        ShaderProperties
        {
            _Tiling = 0.056


            _MainTexLow = MagDes_Haun/VisualMods/Parallax/Terrain/MoonLow_Color.dds
            _MainTexMid = MagDes_Haun/VisualMods/Parallax/Terrain/MoonMid_Color.dds
            _MainTexHigh = MagDes_Haun/VisualMods/Parallax/Terrain/MoonHigh_Color.dds
            _MainTexSteep = MagDes_Haun/VisualMods/Parallax/Terrain/MoonSteep_Color.dds

            _BumpMapLow = MagDes_Haun/VisualMods/Parallax/Terrain/MoonLow_NRM.dds
            _BumpMapMid = MagDes_Haun/VisualMods/Parallax/Terrain/MoonMid_NRM.dds
            _BumpMapHigh = MagDes_Haun/VisualMods/Parallax/Terrain/MoonHigh_NRM.dds
            _BumpMapSteep = MagDes_Haun/VisualMods/Parallax/Terrain/MoonSteep_NRM.dds
            _BumpScale = 1

            _DisplacementMap = MagDes_Haun/VisualMods/Parallax/Terrain/Moon_Displacement.dds
            _InfluenceMap = MagDes_Haun/VisualMods/Parallax/Terrain/Moon_Influence.dds

            _DisplacementScale = 0.07
            _DisplacementOffset = 0.011

            _SteepPower = 4
            _SteepContrast = 4
            _SteepMidpoint = 0.731

            _EmissionColor = 0,0,0,1
            _Hapke = 1
            _SpecularPower = 0.005
            _SpecularIntensity = 1
            _FresnelPower = 0.800000012
            _EnvironmentMapFactor = 0.100000001
            _RefractionIntensity = 0

            _LowMidBlendStart = -10000
            _LowMidBlendEnd = -7000
            _MidHighBlendStart = 14000
            _MidHighBlendEnd = 18000

        }
        ParallaxScaledProperties
        {
            mode = CustomRequiresTerrain
            //usingStockMesh = False
            minTerrainAltitude = 500
            maxTerrainAltitude = 2500
            Material
            {
                customShaderName = Custom/HapkeScaled
                _ColorMap  = MagDes_Haun/KopernicusFiles/5_Limnus/PluginData/Phenix_Color.dds
                _BumpMap   = MagDes_Haun/KopernicusFiles/5_Limnus/PluginData/Phenix_Normal.dds
                _HeightMap = MagDes_Haun/KopernicusFiles/5_Limnus/PluginData/Phenix_Elevation.dds
                _ScatteringTex = MagDes_Haun/VisualMods/Parallax/Scaled/Generic_Hapke_Scatter.png
                _SurgeTex      = MagDes_Haun/VisualMods/Parallax/Scaled/Generic_Hapke_SHOE.png
                _Blend = 1
                _PlanetBumpScale = 1
                _LightBoost = 1
                _GammaBoost = 1
                _porosityCoeffient = 1.86
                _Theta = 18
                Keywords
                {
                    name = NO_TILING_TEXTURES
                }
            }
            TerrainMaterialOverride
            {
                _SpecularIntensity = 0
                _Hapke = 2.2
                _BumpScale = 0
                _Tiling = 0
                _SpecularIntensity = 0.05
                _EnvironmentMapFactor = 0
            }
        }
    }
	
}