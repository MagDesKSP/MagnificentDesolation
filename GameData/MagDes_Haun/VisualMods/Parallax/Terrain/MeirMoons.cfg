@Kopernicus:AFTER[MagDes]:NEEDS[ParallaxContinued]
{
	@Body[Neih]
    {
        %Debug
        {
            %exportMesh = True
            %update = True
        }
        %cacheFile = ParallaxContinued/Models/ScaledMesh.bin
		@PQS
        {
            @Mods
            {
                Parallax
                {
                    subdivisionLevel = 7
                    subdivisionRadius = 700
                    order = 999999
                }
            }
        }
    }
	@Body[Ripley]
    {
        @PQS
        {
            @Mods
            {
                Parallax
                {
                    subdivisionLevel = 7
                    subdivisionRadius = 700
                    order = 999999
                }
            }
        }
    }
}
